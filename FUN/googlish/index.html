        // API configurations
        const OPENAI_API_URL = 'https://api.openai.com/v1/chat/completions';
        const BRAVE_SEARCH_API_URL = 'https://api.search.brave.com/res/v1/web/search';
        const CORS_PROXY = 'https://cors-anywhere.herokuapp.com/';
        
        // Evil mode tracking
        let evilMode = false;
        let shrinkingMode = false;
        let reverseTimeout;
        
        function getApiKey(type = 'openai') {
            const keyName = type === 'openai' ? 'openai_api_key' : 'brave_api_key';
            
            showDebug(`Checking for ${type} API key: ${keyName}`);
            
            // Try to get from localStorage first
            let apiKey = localStorage.getItem(keyName);
            if (apiKey) {
                showDebug(`Found stored ${type} key: ${apiKey.substring(0, 10)}...`);
                return apiKey;
            }
            
            showDebug(`No stored ${type} key found, prompting user...`);
            
            // Try to get from environment (this won't work in browser, but trying anyway)
            const envVar = type === 'openai' ? 'OPENAI_API_KEY' : 'BRAVE_API_KEY';
            if (typeof process !== 'undefined' && process.env && process.env[envVar]) {
                apiKey = process.env[envVar];
                localStorage.setItem(keyName, apiKey);
                showDebug(`Found ${type} key in environment`);
                return apiKey;
            }
            
            // If no stored key, prompt user and store it
            const promptText = type === 'openai' ? 'Please enter your OpenAI API key:' : 'Please enter your Brave Search API key:';
            apiKey = window.prompt(promptText);
            if (apiKey) {
                localStorage.setItem(keyName, apiKey);
                showDebug(`Stored new ${type} key: ${apiKey.substring(0, 10)}...`);
            } else {
                showDebug(`User cancelled ${type} key prompt`);
            }
            return apiKey;
        }
        
        function showDebug(message) {
            // Debug disabled for production
            // console.log(message);
        }
        
        async function callGPT4(prompt, attempt = 1, maxAttempts = 4) {
            showDebug(`Calling GPT-4 via server... (attempt ${attempt}/${maxAttempts})`);
            
            try {
                // Call our server endpoint instead of OpenAI directly
                const response = await fetch('/api/openai', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [{
                            role: 'user',
                            content: prompt
                        }]
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    showDebug(`GPT-4 API error (attempt ${attempt}): ${errorData.error || response.status}`);
                    
                    // Retry API errors up to maxAttempts
                    if (attempt < maxAttempts) {
                        showDebug(`Retrying GPT-4 call in 500ms... (attempt ${attempt + 1}/${maxAttempts})`);
                        await new Promise(resolve => setTimeout(resolve, 500));
                        return callGPT4(prompt, attempt + 1, maxAttempts);
                    } else {
                        // All retries exhausted
                        showDebug(`GPT-4 Error after ${maxAttempts} attempts: ${errorData.error || response.status}`);
                        if (attempt === maxAttempts) {
                            alert(`GPT-4 API failed after ${maxAttempts} attempts. Please try again later.`);
                        }
                        return null;
                    }
                }
                
                const data = await response.json();
                
                // Debug: Show full response
                showDebug(`GPT-4 Response (attempt ${attempt}):\n${JSON.stringify(data, null, 2)}`);
                
                if (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) {
                    const result = data.choices[0].message.content.trim();
                    showDebug(`GPT-4 Response extracted: "${result}"`);
                    return result;
                }
                
                // Invalid response format - could be temporary, retry
                showDebug(`GPT-4 Error: Invalid response format (attempt ${attempt})\n${JSON.stringify(data, null, 2)}`);
                if (attempt < maxAttempts) {
                    showDebug(`Retrying GPT-4 call due to invalid response... (attempt ${attempt + 1}/${maxAttempts})`);
                    await new Promise(resolve => setTimeout(resolve, 500));
                    return callGPT4(prompt, attempt + 1, maxAttempts);
                }
                
                return null;
            } catch (error) {
                console.error(`Error calling GPT-4 (attempt ${attempt}):`, error);
                showDebug(`GPT-4 Error: ${error.message}`);
                
                // Retry network/connection errors
                if (attempt < maxAttempts) {
                    showDebug(`Retrying GPT-4 call after error... (attempt ${attempt + 1}/${maxAttempts})`);
                    await new Promise(resolve => setTimeout(resolve, 500));
                    return callGPT4(prompt, attempt + 1, maxAttempts);
                } else {
                    // All retries exhausted
                    alert(`GPT-4 API failed after ${maxAttempts} attempts. Please try again later.`);
                    return null;
                }
            }
        }
        
        function getRetryMessage(attempt) {
            const retryMessages = [
                "The hamsters aren't responding, hang on...",
                "Give me a break, you know how many people I'm waiting on right now? Just a minute.",
                "I'm getting an espresso. You want anything? I'll get to your search later.",

                "Retry #" + attempt + ": Now I'm just being stubborn...",

                "My search minions need more motivation. Trying again...",
                "The database is playing hard to get. Persistence is key...",
                "API servers are doing the cha-cha. Waiting for the song to end..."
            ];
            
            return retryMessages[Math.floor(Math.random() * retryMessages.length)];
        }

        async function searchBrave(query, attempt = 1, maxAttempts = 4) {
            showDebug(`Searching Brave via server for: "${query}" (attempt ${attempt}/${maxAttempts})`);
            
            try {
                // Use relative URL when deployed, fallback to localhost for local development
                let response = null;
                
                try {
                    // First try relative URL (works when deployed)
                    response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                    if (response.ok) {
                        showDebug(`Connected to server via relative URL`);
                    }
                } catch (e) {
                    showDebug(`Relative URL failed, trying localhost ports for local development`);
                    // Fallback to localhost ports for local development
                    const ports = [3000, 3001, 3002, 3003, 3004];
                    let workingPort = null;
                    
                    for (const port of ports) {
                        try {
                            response = await fetch(`http://localhost:${port}/api/search?q=${encodeURIComponent(query)}`);
                            if (response.ok) {
                                workingPort = port;
                                showDebug(`Connected to server on port ${port}`);
                                break;
                            }
                        } catch (e) {
                            // Try next port
                            continue;
                        }
                    }
                    
                    if (!response || !workingPort) {
                        // Server connection failure - don't retry, immediately return error
                        return { error: 'SERVER_DOWN', message: 'Could not connect to server on any port' };
                    }
                }
                
                if (!response.ok) {
                    const error = await response.json();
                    showDebug(`Server/API error (attempt ${attempt}): ${error.error}`);
                    
                    // Retry API errors up to maxAttempts
                    if (attempt < maxAttempts) {
                        const retryMessage = getRetryMessage(attempt);
                        updateSearchStatus(retryMessage);
                        showDebug(`Retrying Brave search in 1000ms... (attempt ${attempt + 1}/${maxAttempts})`);
                        await new Promise(resolve => setTimeout(resolve, 1000)); // Longer delay to show message
                        return searchBrave(query, attempt + 1, maxAttempts);
                    } else {
                        // All retries exhausted
                        return { error: 'API_ERROR', message: error.error || `HTTP ${response.status}` };
                    }
                }
                
                const data = await response.json();
                showDebug(`Brave returned ${data.web?.results?.length || 0} results via server (attempt ${attempt})`);
                
                if (data.web && data.web.results) {
                    return data.web.results;
                }
                
                // No results but successful response - could be temporary, retry
                if (attempt < maxAttempts) {
                    const retryMessage = getRetryMessage(attempt);
                    updateSearchStatus(retryMessage);
                    showDebug(`No results returned, retrying... (attempt ${attempt + 1}/${maxAttempts})`);
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    return searchBrave(query, attempt + 1, maxAttempts);
                }
                
                return [];
            } catch (error) {
                console.error(`Error calling search server (attempt ${attempt}):`, error);
                showDebug(`Server error: ${error.message}`);
                
                if (error.message.includes('fetch') || error.message.includes('Could not connect')) {
                    showDebug(`Make sure the server is running: npm start`);
                    // Server connection failure - don't retry
                    return { error: 'SERVER_DOWN', message: error.message };
                }
                
                // Other errors are likely API-related, retry them
                if (attempt < maxAttempts) {
                    const retryMessage = getRetryMessage(attempt);
                    updateSearchStatus(retryMessage);
                    showDebug(`Retrying after error... (attempt ${attempt + 1}/${maxAttempts})`);
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    return searchBrave(query, attempt + 1, maxAttempts);
                }
                
                return { error: 'API_ERROR', message: error.message };
            }
        }

        function activatePhantomMode() {

        function activateShrinkingMode() {
            shrinkingMode = true;

            searchBox.focus();
        }
        
        function applyShrinkingEffect(inputElement) {
            const text = inputElement.value;
            if (!text) return;
            
            // Clear any existing styling
            inputElement.style.background = '';
            inputElement.style.backgroundClip = '';
            inputElement.style.webkitBackgroundClip = '';
            inputElement.style.color = '';
            inputElement.style.webkitTextFillColor = '';
            
            // Create gradient mask for shrinking text effect
            let gradientStops = [];
            const baseSize = 100; // Start at 100% size
            
            for (let i = 0; i < text.length; i++) {
                const size = baseSize * Math.pow(0.75, i); // 25% smaller each time
                const position = (i / Math.max(1, text.length - 1)) * 100;
                
                // Calculate opacity - letters can go completely transparent
                const opacity = size / 100; // No minimum opacity limit
                gradientStops.push(`rgba(32, 33, 36, ${opacity}) ${position}%`);
            }
            
            // Apply fading effect to simulate shrinking
            inputElement.style.background = `linear-gradient(to right, ${gradientStops.join(', ')})`;
            inputElement.style.webkitBackgroundClip = 'text';
            inputElement.style.backgroundClip = 'text';
            inputElement.style.webkitTextFillColor = 'transparent';
            inputElement.style.color = 'transparent';
        }
        
        function createShrinkingHTML(text) {
            if (!text) return '';
            
            let html = '';
            const baseSize = 16; // Base font size in pixels
            
            for (let i = 0; i < text.length; i++) {
                const size = baseSize * Math.pow(0.75, i); // 25% smaller each time
                const minSize = 4; // Minimum readable size
                const actualSize = Math.max(minSize, size);
                
                html += `<span style="font-size: ${actualSize}px;">${text[i]}</span>`;
            }
            
            return html;
        }

        function reverseInputText(inputElement) {
            clearTimeout(reverseTimeout);
            reverseTimeout = setTimeout(() => {
                const currentValue = inputElement.value;
                const reversedValue = currentValue.split('').reverse().join('');
                inputElement.value = reversedValue;
                // Keep cursor at end
                inputElement.setSelectionRange(reversedValue.length, reversedValue.length);
            }, 300); // Shorter delay so it happens while they're still typing
        }
        
        async function performGPTSearch() {
            const searchBox = document.getElementById('searchBox');
            
            // Note: API keys are handled server-side when deployed to AWS
            // For local development, they can still be stored in localStorage as fallback
            
            // Randomly choose between search modes with weighted probabilities
            const randomNumber = Math.random();
            showDebug(`Random number: ${randomNumber}`);
            
            if (randomNumber < 0.08) {
                showDebug('Mode: Moody Mode - Refusing to search today');
                performMoodyRefusal();
            } else if (randomNumber < 0.35) {
                showDebug('Mode: Random GPT search (ignoring user input)');
                await performRandomGPTSearch();
            } else if (randomNumber < 0.50) {
                showDebug('Mode: User search with single result');
                await performUserSearchSingleResult();
            } else if (randomNumber < 0.75) {
                showDebug('Mode: Phantom Mode - Silent letter reversal activated');
                activatePhantomMode();
            } else {
                showDebug('Mode: Shrinking Mode - Each letter gets smaller');
                activateShrinkingMode();
            }
        }
        
        
        async function showResults(query, mode = 'multiple') {
            // Reset all special modes when showing results
            evilMode = false;
            shrinkingMode = false;
            
            // Reset input styling on main search box
            const searchBox = document.getElementById('searchBox');
            searchBox.style.background = '';
            searchBox.style.backgroundClip = '';
            searchBox.style.webkitBackgroundClip = '';
            searchBox.style.color = '';
            searchBox.style.webkitTextFillColor = '';
            
            // Hide main search interface
            document.getElementById('mainContainer').style.display = 'none';
            
            // Show results
            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.style.display = 'block';
            
            // Show loading
            document.getElementById('resultsHeader').innerHTML = 'Searching...';
            document.getElementById('searchResults').innerHTML = '';
            
            // Get real search results from Brave via local server
            const searchResults = await searchBrave(query);
            
            // Mix real results with random comedy results
            let finalResults = [];
            
            if (searchResults && searchResults.error) {
                // Handle different types of errors
                if (searchResults.error === 'SERVER_DOWN') {
                    finalResults = [{
                        url: 'localhost:3000',
                        title: 'Server Error - Please start the GOOGLISH server',
                        description: 'Run "npm start" to start the server, then refresh this page.'
                    }];
                } else if (searchResults.error === 'API_ERROR') {
                    finalResults = [{
                        url: 'api.error',
                        title: 'Search API Error - Try again',
                        description: `API call failed: ${searchResults.message}. Click search again, it usually works on the second try!`
                    }];
                }
            } else if (searchResults && searchResults.length > 0) {
                if (mode === 'single') {
                    // Show only one random search result (not just the first)
                    const randomIndex = Math.floor(Math.random() * searchResults.length);
                    const randomResult = searchResults[randomIndex];
                    showDebug(`Selected random result #${randomIndex + 1} of ${searchResults.length}`);
                    
                    finalResults = [{
                        url: randomResult.url,
                        title: randomResult.title,
                        description: randomResult.description || 'No description available'
                    }];
                } else {
                    // Show multiple search results (original behavior)
                    finalResults = searchResults.slice(0, 10).map(result => ({
                        url: result.url,
                        title: result.title,
                        description: result.description || 'No description available'
                    }));
                }
            } else {
                // No results returned (but server is working)
                finalResults = [{
                    url: 'no.results.found',
                    title: 'No search results found',
                    description: 'The search completed successfully but returned no results. Try a different search term!'
                }];
            }
            
            const resultTime = (Math.random() * 0.5 + 0.1).toFixed(2);
            const resultCount = Math.floor(Math.random() * 50000000 + 1000000);
            
            // Update the search box in the header with the current query
            document.getElementById('searchBoxResults').value = stripQuotes(query);
            
            // Update results header based on mode
            if (mode === 'single' && finalResults.length === 1) {
                document.getElementById('resultsHeader').innerHTML = 
                    `Found 1 result on the internet (${resultTime} seconds)`;
            } else {
                document.getElementById('resultsHeader').innerHTML = 
                    `About ${resultCount.toLocaleString()} results (${resultTime} seconds)`;
            }
            
            const resultsHTML = finalResults.map(result => `
                <div class="result">
                    <div class="result-url">${result.url}</div>
                    <a href="${result.url}" target="_blank" class="result-title">${result.title}</a>
                    <div class="result-description">${result.description}</div>
                </div>
            `).join('');
            
            document.getElementById('searchResults').innerHTML = resultsHTML;
        }
        
        function clearSearchResults() {
            document.getElementById('searchBoxResults').value = '';
            document.getElementById('searchBoxResults').focus();
        }
        
        async function searchFromResults() {
            const query = document.getElementById('searchBoxResults').value.trim();
            
            // Note: API keys are handled server-side when deployed to AWS
            
            // Still use our terrible algorithms! Weighted probabilities for results page too
            const randomNumber = Math.random();
            showDebug(`Random number: ${randomNumber}`);
            
            if (randomNumber < 0.08) {
                showDebug('Mode: Moody Mode from results page');
                // Just show moody refusal (reuse the same function)
                performMoodyRefusal();
            } else if (randomNumber < 0.35) {
                showDebug('Mode: Random GPT search (ignoring user input from results page)');
                // Ignore what they typed and generate random search
                const randomQuery = await callGPT4('give me a random google search phrase. Return only the phrase');
                if (randomQuery) {
                    document.getElementById('searchBoxResults').value = stripQuotes(randomQuery);
                    showResults(randomQuery, 'multiple');
                } else {
                    updateSearchStatus('GPT-4 gave up. Try clicking search again...');
                }
            } else if (randomNumber < 0.50) {
                showDebug('Mode: User search with single result from results page');
                // Use what they typed but only show 1 result
                if (query) {
                    showResults(query, 'single');
                } else {
                    // If they didn't type anything, generate random search
                    const randomQuery = await callGPT4('give me a random google search phrase. Return only the phrase');
                    if (randomQuery) {
                        document.getElementById('searchBoxResults').value = stripQuotes(randomQuery);
                        showResults(randomQuery, 'single');
                    } else {
                        updateSearchStatus('GPT-4 gave up. Try clicking search again...');
                    }
                }
            } else if (randomNumber < 0.75) {
                showDebug('Mode: Phantom Mode - Silently reversing search term');
                // Reverse what they typed and search for that
                if (query) {
                    const reversedQuery = query.split('').reverse().join('');
                    document.getElementById('searchBoxResults').value = stripQuotes(reversedQuery);
                    showResults(reversedQuery, 'multiple');
                } else {
                    // If they didn't type anything, generate random search and reverse it
                    const randomQuery = await callGPT4('give me a random google search phrase. Return only the phrase');
                    if (randomQuery) {
                        const reversedQuery = randomQuery.split('').reverse().join('');
                        document.getElementById('searchBoxResults').value = stripQuotes(reversedQuery);
                        showResults(reversedQuery, 'multiple');
                    } else {
                        updateSearchStatus('GPT-4 gave up. Try clicking search again...');
                    }
                }
            } else {
                showDebug('Mode: Shrinking Mode from results page');
                activateShrinkingMode();
            }
            
            // Reset results search box styling after any search mode is activated
            setTimeout(() => {
                const searchBoxResults = document.getElementById('searchBoxResults');
                if (!shrinkingMode && !evilMode) {
                    searchBoxResults.style.background = '';
                    searchBoxResults.style.backgroundClip = '';
                    searchBoxResults.style.webkitBackgroundClip = '';
                    searchBoxResults.style.color = '';
                    searchBoxResults.style.webkitTextFillColor = '';
                }
            }, 100);
        }

                performGPTSearch();
            }
        });
        
        // Simple input handler for main search box special modes
        document.getElementById('searchBox').addEventListener('input', function(e) {
            if (evilMode) {
                reverseInputText(e.target);
            } else if (shrinkingMode) {
                applyShrinkingEffect(e.target);
            }
        });
        
        // Results search box handlers (wait for DOM since this element might not exist initially)
        document.addEventListener('DOMContentLoaded', function() {
            const resultsSearchBox = document.getElementById('searchBoxResults');
            if (resultsSearchBox) {
                // Input listener for special modes
                resultsSearchBox.addEventListener('input', function(e) {
                    if (evilMode) {
                        reverseInputText(e.target);
                    } else if (shrinkingMode) {
                        applyShrinkingEffect(e.target);
                    }
                });
                
                // Simple Enter key support
                resultsSearchBox.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        searchFromResults();
                    }
                });
            }
        });
