    <script>
        // API configurations
        const OPENAI_API_URL = 'https://api.openai.com/v1/chat/completions';
        const BRAVE_SEARCH_API_URL = 'https://api.search.brave.com/res/v1/web/search';
        const CORS_PROXY = 'https://cors-anywhere.herokuapp.com/';
        
        // Evil mode tracking
        let evilMode = false;
        let reverseTimeout;
        
        function getApiKey(type = 'openai') {
            const keyName = type === 'openai' ? 'openai_api_key' : 'brave_api_key';
            
            showDebug(`Checking for ${type} API key: ${keyName}`);
            
            // Try to get from localStorage first
            let apiKey = localStorage.getItem(keyName);
            if (apiKey) {
                showDebug(`Found stored ${type} key: ${apiKey.substring(0, 10)}...`);
                return apiKey;
            }
            
            showDebug(`No stored ${type} key found, prompting user...`);
            
            // Try to get from environment (this won't work in browser, but trying anyway)
            const envVar = type === 'openai' ? 'OPENAI_API_KEY' : 'BRAVE_API_KEY';
            if (typeof process !== 'undefined' && process.env && process.env[envVar]) {
                apiKey = process.env[envVar];
                localStorage.setItem(keyName, apiKey);
                showDebug(`Found ${type} key in environment`);
                return apiKey;
            }
            
            // If no stored key, prompt user and store it
            const promptText = type === 'openai' ? 'Please enter your OpenAI API key:' : 'Please enter your Brave Search API key:';
            apiKey = window.prompt(promptText);
            if (apiKey) {
                localStorage.setItem(keyName, apiKey);
                showDebug(`Stored new ${type} key: ${apiKey.substring(0, 10)}...`);
            } else {
                showDebug(`User cancelled ${type} key prompt`);
            }
            return apiKey;
        }
        
        function showDebug(message) {
            // Debug disabled for production
            // console.log(message);
        }
        
        async function callGPT4(prompt) {
            const apiKey = getApiKey();
            
            if (!apiKey) {
                alert('API key required for GPT-4 integration!');
                return null;
            }
            
            showDebug('Calling gpt-4.1-nano...');
            
            try {
                const response = await fetch(OPENAI_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4.1-nano',
                        messages: [{
                            role: 'user',
                            content: prompt
                        }],
                        max_tokens: 50,
                        temperature: 1.0
                    })
                });
                
                const data = await response.json();
                
                // Debug: Show full response
                showDebug(`GPT-4 Response:\n${JSON.stringify(data, null, 2)}`);
                
                if (data.choices && data.choices[0]) {
                    const result = data.choices[0].message.content.trim();
                    showDebug(`GPT-4 Response:\nFull: ${JSON.stringify(data, null, 2)}\n\nExtracted: "${result}"`);
                    return result;
                }
                
                showDebug(`GPT-4 Error: No choices in response\n${JSON.stringify(data, null, 2)}`);
                return null;
            } catch (error) {
                console.error('Error calling GPT-4:', error);
                showDebug(`GPT-4 Error:\n${error.message}\n\nFull error: ${JSON.stringify(error, null, 2)}`);
                alert('Error calling GPT-4 API. Check debug panel for details.');
                return null;
            }
        }
        
        async function searchBrave(query) {
            showDebug(`Searching Brave via local server for: "${query}"`);
            
            try {
                // Try different ports in case server is running on a different port
                const ports = [3000, 3001, 3002, 3003, 3004];
                let response = null;
                let workingPort = null;
                
                for (const port of ports) {
                    try {
                        response = await fetch(`http://localhost:${port}/api/search?q=${encodeURIComponent(query)}`);
                        if (response.ok) {
                            workingPort = port;
                            showDebug(`Connected to server on port ${port}`);
                            break;
                        }
                    } catch (e) {
                        // Try next port
                        continue;
                    }
                }
                
                if (!response || !workingPort) {
                    throw new Error('Could not connect to server on any port');
                }
                
                if (!response.ok) {
                    const error = await response.json();
                    showDebug(`Server error: ${error.error}`);
                    throw new Error(`HTTP ${response.status}: ${error.error}`);
                }
                
                const data = await response.json();
                showDebug(`Brave returned ${data.web?.results?.length || 0} results via server`);
                
                if (data.web && data.web.results) {
                    return data.web.results;
                }
                
                return [];
            } catch (error) {
                console.error('Error calling local search server:', error);
                showDebug(`Local server error: ${error.message}`);
                
                if (error.message.includes('fetch')) {
                    showDebug(`Make sure the server is running: npm start`);
                }
                
                return [];
            }
        }

        async function performRandomGPTSearch() {
            const searchBox = document.getElementById('searchBox');
            
            searchBox.placeholder = 'Generating random search with GPT-4...';
            searchBox.disabled = true;
            
            // Generate a random search phrase with GPT-4
            const query = await callGPT4('give me a random google search phrase. Return only the phrase');
            
            searchBox.disabled = false;
            searchBox.placeholder = 'Search the web in a completely unhelpful way...';
            
            if (!query) {
                return;
            }
            
            searchBox.value = query;
            showResults(query, 'multiple');
        }
        
        async function performUserSearchSingleResult() {
            const searchBox = document.getElementById('searchBox');
            let query = searchBox.value.trim();
            
            // If user didn't type anything, generate a random search
            if (!query) {
                searchBox.placeholder = 'Generating search with GPT-4...';
                searchBox.disabled = true;
                
                query = await callGPT4('give me a random google search phrase. Return only the phrase');
                
                searchBox.disabled = false;
                searchBox.placeholder = 'Search the web in a completely unhelpful way...';
                
                if (!query) {
                    return;
                }
                
                searchBox.value = query;
            }
            
            showResults(query, 'single');
        }
        
        function activatePhantomMode() {
            evilMode = true;
            showDebug('Mode: Phantom Mode - Letters will silently reverse');
            
            const searchBox = document.getElementById('searchBox');
            searchBox.focus();
        }
        
        function performMoodyRefusal() {
            showDebug('Mode: Moody Mode - Refusing to search');
            
            const moodyMessages = [
                "I'm not in the mood right now",
                "Ask me later",
                "Nope, not today",
                "I'm having an off day",
                "Maybe tomorrow",
                "I'm feeling lazy",
                "Can't be bothered",
                "Try again when I feel better",
                "I'm on a break",
                "Not feeling it today"
            ];
            
            const randomMessage = moodyMessages[Math.floor(Math.random() * moodyMessages.length)];
            
            // Create a fake "search result" that's just the moody message
            const query = document.getElementById('searchBox').value.trim() || "your search";
            
            // Show results page but with just the moody message
            document.getElementById('mainContainer').style.display = 'none';
            
            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.style.display = 'block';
            
            // Update the search box in the header
            document.getElementById('searchBoxResults').value = query;
            
            // Show moody message as the only "result"
            document.getElementById('resultsHeader').innerHTML = 'About 0 results (0.00 seconds)';
            
            document.getElementById('searchResults').innerHTML = `
                <div style="text-align: center; padding: 60px 20px; color: #70757a; font-size: 18px;">
                    <div style="font-size: 48px; margin-bottom: 20px;">😑</div>
                    <div>${randomMessage}</div>
                    <div style="font-size: 14px; margin-top: 10px; color: #9aa0a6;">Try clicking search again... maybe I'll feel better</div>
                </div>
            `;
        }
        
        function reverseInputText(inputElement) {
            clearTimeout(reverseTimeout);
            reverseTimeout = setTimeout(() => {
                const currentValue = inputElement.value;
                const reversedValue = currentValue.split('').reverse().join('');
                inputElement.value = reversedValue;
                // Keep cursor at end
                inputElement.setSelectionRange(reversedValue.length, reversedValue.length);
            }, 300); // Shorter delay so it happens while they're still typing
        }
        
        async function performGPTSearch() {
            const searchBox = document.getElementById('searchBox');
            
            // Check API keys first
            const openaiKey = getApiKey('openai');
            if (!openaiKey) {
                alert('OpenAI API key required!');
                return;
            }
            
            const braveKey = getApiKey('brave');
            if (!braveKey) {
                alert('Brave Search API key required!');
                return;
            }
            
            // Randomly choose between search modes with weighted probabilities
            const randomNumber = Math.random();
            showDebug(`Random number: ${randomNumber}`);
            
            if (randomNumber < 0.1) {
                showDebug('Mode: Moody Mode - Refusing to search today');
                performMoodyRefusal();
            } else if (randomNumber < 0.4) {
                showDebug('Mode: Random GPT search (ignoring user input)');
                await performRandomGPTSearch();
            } else if (randomNumber < 0.7) {
                showDebug('Mode: User search with single result');
                await performUserSearchSingleResult();
            } else {
                showDebug('Mode: Phantom Mode - Silent letter reversal activated');
                activatePhantomMode();
            }
        }
        
        
        async function showResults(query, mode = 'multiple') {
            // Hide main search interface
            document.getElementById('mainContainer').style.display = 'none';
            
            // Show results
            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.style.display = 'block';
            
            // Show loading
            document.getElementById('resultsHeader').innerHTML = 'Searching...';
            document.getElementById('searchResults').innerHTML = '';
            
            // Get real search results from Brave via local server
            const searchResults = await searchBrave(query);
            
            // Mix real results with random comedy results
            let finalResults = [];
            
            if (searchResults && searchResults.length > 0) {
                if (mode === 'single') {
                    // Show only one random search result (not just the first)
                    const randomIndex = Math.floor(Math.random() * searchResults.length);
                    const randomResult = searchResults[randomIndex];
                    showDebug(`Selected random result #${randomIndex + 1} of ${searchResults.length}`);
                    
                    finalResults = [{
                        url: randomResult.url,
                        title: randomResult.title,
                        description: randomResult.description || 'No description available'
                    }];
                } else {
                    // Show multiple search results (original behavior)
                    finalResults = searchResults.slice(0, 10).map(result => ({
                        url: result.url,
                        title: result.title,
                        description: result.description || 'No description available'
                    }));
                }
            } else {
                // Fallback message if server is down
                finalResults = [{
                    url: 'localhost:3000',
                    title: 'Server Error - Please start the GOOGLISH server',
                    description: 'Run "npm start" to start the server, then refresh this page.'
                }];
            }
            
            const resultTime = (Math.random() * 0.5 + 0.1).toFixed(2);
            const resultCount = Math.floor(Math.random() * 50000000 + 1000000);
            
            // Update the search box in the header with the current query
            document.getElementById('searchBoxResults').value = query;
            
            // Update results header based on mode
            if (mode === 'single' && finalResults.length === 1) {
                document.getElementById('resultsHeader').innerHTML = 
                    `Found 1 result on the internet (${resultTime} seconds)`;
            } else {
                document.getElementById('resultsHeader').innerHTML = 
                    `About ${resultCount.toLocaleString()} results (${resultTime} seconds)`;
            }
            
            const resultsHTML = finalResults.map(result => `
                <div class="result">
                    <div class="result-url">${result.url}</div>
                    <a href="${result.url}" target="_blank" class="result-title">${result.title}</a>
                    <div class="result-description">${result.description}</div>
                </div>
            `).join('');
            
            document.getElementById('searchResults').innerHTML = resultsHTML;
        }
        
        function clearSearchResults() {
            document.getElementById('searchBoxResults').value = '';
            document.getElementById('searchBoxResults').focus();
        }
        
        async function searchFromResults() {
            const query = document.getElementById('searchBoxResults').value.trim();
            
            // Check API keys first
            const openaiKey = getApiKey('openai');
            if (!openaiKey) {
                alert('OpenAI API key required!');
                return;
            }
            
            const braveKey = getApiKey('brave');
            if (!braveKey) {
                alert('Brave Search API key required!');
                return;
            }
            
            // Still use our terrible algorithms! Weighted probabilities for results page too
            const randomNumber = Math.random();
            showDebug(`Random number: ${randomNumber}`);
            
            if (randomNumber < 0.1) {
                showDebug('Mode: Moody Mode from results page');
                // Just show moody refusal (reuse the same function)
                performMoodyRefusal();
            } else if (randomNumber < 0.4) {
                showDebug('Mode: Random GPT search (ignoring user input from results page)');
                // Ignore what they typed and generate random search
                const randomQuery = await callGPT4('give me a random google search phrase. Return only the phrase');
                if (randomQuery) {
                    document.getElementById('searchBoxResults').value = randomQuery;
                    showResults(randomQuery, 'multiple');
                }
            } else if (randomNumber < 0.7) {
                showDebug('Mode: User search with single result from results page');
                // Use what they typed but only show 1 result
                if (query) {
                    showResults(query, 'single');
                } else {
                    // If they didn't type anything, generate random search
                    const randomQuery = await callGPT4('give me a random google search phrase. Return only the phrase');
                    if (randomQuery) {
                        document.getElementById('searchBoxResults').value = randomQuery;
                        showResults(randomQuery, 'single');
                    }
                }
            } else {
                showDebug('Mode: Phantom Mode - Silently reversing search term');
                // Reverse what they typed and search for that
                if (query) {
                    const reversedQuery = query.split('').reverse().join('');
                    document.getElementById('searchBoxResults').value = reversedQuery;
                    showResults(reversedQuery, 'multiple');
                } else {
                    // If they didn't type anything, generate random search and reverse it
                    const randomQuery = await callGPT4('give me a random google search phrase. Return only the phrase');
                    if (randomQuery) {
                        const reversedQuery = randomQuery.split('').reverse().join('');
                        document.getElementById('searchBoxResults').value = reversedQuery;
                        showResults(reversedQuery, 'multiple');
                    }
                }
            }
        }
        
        function goBackToSearch() {
            document.getElementById('mainContainer').style.display = 'flex';
            document.getElementById('resultsContainer').style.display = 'none';
            document.getElementById('searchBox').value = '';
        }
        
        // Allow Enter key to search
        document.getElementById('searchBox').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (evilMode) {
                    // In phantom mode, search with whatever reversed text they have
                    const reversedQuery = document.getElementById('searchBox').value;
                    showDebug(`Searching with phantom-reversed text: "${reversedQuery}"`);
                    showResults(reversedQuery, 'multiple');
                    evilMode = false; // Reset phantom mode
                } else {
                    performGPTSearch();
                }
            }
        });
        
        // Add input listener to main search box for phantom mode
        document.getElementById('searchBox').addEventListener('input', function(e) {
            if (evilMode) {
                reverseInputText(e.target);
            }
        });
        
        // Also add to results search box for phantom mode
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('searchBoxResults').addEventListener('input', function(e) {
                if (evilMode) {
                    reverseInputText(e.target);
                }
            });
        });
        
        // Add Enter key support to results search box
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('searchBoxResults').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchFromResults();
                }
            });
        });
    </script>
</body>
</html>
