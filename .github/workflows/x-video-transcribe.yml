name: x-video-transcribe

# Runs the EXPERIMENTS/x-video-transcribe pipeline on a GitHub-hosted
# runner (open egress), then opens a GitHub issue with the transcript
# so it's readable on mobile and via the GitHub MCP.
#
# Two ways to trigger:
#   1. Edit EXPERIMENTS/x-video-transcribe/url.txt and push  (preferred)
#   2. Actions UI → "Run workflow" with a URL input

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video URL (X.com, YouTube, etc.)"
        required: false
      model:
        description: "Whisper model size (tiny|base|small|medium)"
        required: false
        default: "base"
  push:
    paths:
      - "EXPERIMENTS/x-video-transcribe/url.txt"

permissions:
  contents: read
  issues: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r EXPERIMENTS/x-video-transcribe/requirements.txt

      - name: Resolve URL and model
        id: cfg
        run: |
          URL="${{ github.event.inputs.url }}"
          MODEL="${{ github.event.inputs.model }}"
          if [ -z "$URL" ] && [ -f EXPERIMENTS/x-video-transcribe/url.txt ]; then
            URL=$(grep -vE '^\s*(#|$)' EXPERIMENTS/x-video-transcribe/url.txt | head -1 | tr -d '\r\n')
          fi
          : "${MODEL:=base}"
          if [ -z "$URL" ]; then
            echo "No URL provided (workflow_dispatch input or url.txt)." >&2
            exit 1
          fi
          echo "url=$URL"   >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        run: |
          mkdir -p EXPERIMENTS/x-video-transcribe/out
          python EXPERIMENTS/x-video-transcribe/transcribe.py \
            "${{ steps.cfg.outputs.url }}" \
            --out-dir EXPERIMENTS/x-video-transcribe/out \
            --model "${{ steps.cfg.outputs.model }}" \
            2>&1 | tee EXPERIMENTS/x-video-transcribe/out/run.log

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Transcript"
            echo
            echo "**URL:** ${{ steps.cfg.outputs.url }}"
            echo "**Model:** ${{ steps.cfg.outputs.model }}"
            echo
            if [ -f EXPERIMENTS/x-video-transcribe/out/transcript-clean.txt ]; then
              cat EXPERIMENTS/x-video-transcribe/out/transcript-clean.txt
            else
              echo '(no transcript — see run.log)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-output
          path: EXPERIMENTS/x-video-transcribe/out/

      - name: Post transcript as GitHub issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.cfg.outputs.url }}
          MODEL: ${{ steps.cfg.outputs.model }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ ! -f EXPERIMENTS/x-video-transcribe/out/transcript-clean.txt ]; then
            echo "No transcript file; skipping issue."
            exit 0
          fi
          TITLE="Transcript: ${URL}"
          BODY_FILE=$(mktemp)
          {
            echo "**Source:** ${URL}"
            echo "**Model:** faster-whisper / ${MODEL}"
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}"
            echo
            cat EXPERIMENTS/x-video-transcribe/out/transcript-clean.txt
            echo
            echo "<details><summary>Timestamped version</summary>"
            echo
            echo '```'
            cat EXPERIMENTS/x-video-transcribe/out/transcript.txt
            echo '```'
            echo
            echo "</details>"
          } > "$BODY_FILE"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body-file "$BODY_FILE"
