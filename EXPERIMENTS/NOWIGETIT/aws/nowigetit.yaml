AWSTemplateFormatVersion: '2010-09-09'
Description: NowIGetIt - Transform scientific PDFs into interactive web apps

Parameters:
  DeploymentBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment packages

  LambdaCodeKey:
    Type: String
    Default: nowigetit/lambda-code.zip
    Description: S3 key for the Lambda deployment zip

  ShareItBucket:
    Type: String
    Default: share-it-amroja
    Description: Existing public S3 bucket for temporary PDF hosting (Claude fetches PDFs from here)

  ShareItUrl:
    Type: String
    Default: https://share-it-amroja.s3.amazonaws.com
    Description: Public HTTPS URL for the ShareIt bucket (Claude API requires HTTPS)

  DomainName:
    Type: String
    Default: nowigetit.us
    Description: Custom domain name for the frontend

  CertificateArn:
    Type: String
    Description: ARN of the ACM certificate for the custom domain

  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID for the custom domain

Resources:
  # ─────────────────────────────────────────────────────────────────
  # SSM Parameter Store - Daily processing limit
  # ─────────────────────────────────────────────────────────────────

  DailyProcessingLimit:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${AWS::StackName}/daily-processing-limit'
      Type: String
      Value: '20'
      Description: Maximum number of PDFs that can be processed per day
  # ─────────────────────────────────────────────────────────────────
  # S3 - Frontend static website
  # ─────────────────────────────────────────────────────────────────

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: Application
          Value: NowIGetIt
        - Key: Stack
          Value: !Ref 'AWS::StackName'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

  # ─────────────────────────────────────────────────────────────────
  # DynamoDB - Job status tracking
  # ─────────────────────────────────────────────────────────────────

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      Tags:
        - Key: Application
          Value: NowIGetIt
        - Key: Stack
          Value: !Ref 'AWS::StackName'
      TableName: !Sub '${AWS::StackName}-jobs'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ─────────────────────────────────────────────────────────────────
  # IAM Role - Shared by all Lambdas
  # ─────────────────────────────────────────────────────────────────

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Application
          Value: NowIGetIt
        - Key: Stack
          Value: !Ref 'AWS::StackName'
      RoleName: !Sub '${AWS::StackName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*:*'
        - PolicyName: DynamoDB
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                Resource: !GetAtt JobsTable.Arn
        - PolicyName: S3ShareIt
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:aws:s3:::${ShareItBucket}/nowigetit/*'
                  - !Sub 'arn:aws:s3:::${ShareItBucket}/NOWIGETIT/*'
        - PolicyName: InvokeProcessor
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-process'
        - PolicyName: SSMParameterAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/daily-processing-limit'
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/anthropic-api-key-*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/github-token-*'

  # ─────────────────────────────────────────────────────────────────
  # Lambda - Upload handler
  # ─────────────────────────────────────────────────────────────────

  UploadFunction:
    Type: AWS::Lambda::Function
    Properties:
      Tags:
        - Key: Application
          Value: NowIGetIt
        - Key: Stack
          Value: !Ref 'AWS::StackName'
      FunctionName: !Sub '${AWS::StackName}-upload'
      Runtime: python3.12
      Handler: lambda_upload.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          SHAREIT_BUCKET: !Ref ShareItBucket
          JOBS_TABLE: !Ref JobsTable
          PROCESSOR_FUNCTION_NAME: !Sub '${AWS::StackName}-process'
          ALLOWED_ORIGIN: !Sub 'https://${DomainName}'
          DAILY_LIMIT_PARAM: !Sub '/${AWS::StackName}/daily-processing-limit'

  # ─────────────────────────────────────────────────────────────────
  # Lambda - Status handler
  # ─────────────────────────────────────────────────────────────────

  StatusFunction:
    Type: AWS::Lambda::Function
    Properties:
      Tags:
        - Key: Application
          Value: NowIGetIt
        - Key: Stack
          Value: !Ref 'AWS::StackName'
      FunctionName: !Sub '${AWS::StackName}-status'
      Runtime: python3.12
      Handler: lambda_status.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          ALLOWED_ORIGIN: !Sub 'https://${DomainName}'

  # ─────────────────────────────────────────────────────────────────
  # Lambda - Processing handler (heavy lifting)
  # ─────────────────────────────────────────────────────────────────

  ProcessFunction:
    Type: AWS::Lambda::Function
    Properties:
      Tags:
        - Key: Application
          Value: NowIGetIt
        - Key: Stack
          Value: !Ref 'AWS::StackName'
      FunctionName: !Sub '${AWS::StackName}-process'
      Runtime: python3.12
      Handler: lambda_process.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 900
      MemorySize: 512
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          ANTHROPIC_API_KEY_ARN: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/anthropic-api-key'
          SHAREIT_BUCKET: !Ref ShareItBucket
          SHAREIT_URL: !Ref ShareItUrl
          SHAREIT_WEBSITE_URL: 'http://share-it-amroja.s3-website-us-east-1.amazonaws.com'

  # ─────────────────────────────────────────────────────────────────
  # API Gateway HTTP API
  # ─────────────────────────────────────────────────────────────────

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Tags:
        Application: NowIGetIt
        Stack: !Ref 'AWS::StackName'
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - POST
          - GET
          - OPTIONS
        AllowOrigins:
          - !Sub 'https://${DomainName}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2

  # Upload route: POST /api/upload
  UploadIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt UploadFunction.Arn
      PayloadFormatVersion: '2.0'

  UploadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/upload
      Target: !Sub 'integrations/${UploadIntegration}'

  UploadPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UploadFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

  # Status route: GET /api/status/{job_id}
  StatusIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt StatusFunction.Arn
      PayloadFormatVersion: '2.0'

  StatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/status/{job_id}
      Target: !Sub 'integrations/${StatusIntegration}'

  StatusPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StatusFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

  # ─────────────────────────────────────────────────────────────────
  # CloudFront - CDN with custom domain
  # ─────────────────────────────────────────────────────────────────

  WwwRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-www-redirect'
      AutoPublish: true
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host.value;
          if (host.startsWith('www.')) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://${DomainName}' + request.uri } }
            };
          }
          return request;
        }
      FunctionConfig:
        Comment: !Sub 'Redirect www.${DomainName} to ${DomainName}'
        Runtime: cloudfront-js-2.0

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - Key: Application
          Value: NowIGetIt
        - Key: Stack
          Value: !Ref 'AWS::StackName'
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} frontend'
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3WebsiteOrigin
            DomainName: !Sub '${FrontendBucket}.s3-website-${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: S3WebsiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WwwRedirectFunction.FunctionARN

  # ─────────────────────────────────────────────────────────────────
  # Route 53 - DNS records
  # ─────────────────────────────────────────────────────────────────

  DnsRecordApex:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront global hosted zone ID

  DnsRecordApexIPv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DnsRecordWww:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DnsRecordWwwIPv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  FrontendUrl:
    Description: Frontend URL (custom domain)
    Value: !Sub 'https://${DomainName}'

  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !GetAtt HttpApi.ApiEndpoint

  FrontendBucketName:
    Description: Name of the frontend S3 bucket
    Value: !Ref FrontendBucket

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (for cache invalidation)
    Value: !Ref CloudFrontDistribution

  JobsTableName:
    Description: Name of the DynamoDB jobs table
    Value: !Ref JobsTable
