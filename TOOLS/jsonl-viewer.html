<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONL Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-card: #1a1a1a;
            --bg-elevated: #242424;
            --border-color: #333;
            --border-hover: #444;
            --text-primary: #f5f5f5;
            --text-secondary: #999;
            --text-muted: #666;
            --accent: #10b981;
            --accent-dim: rgba(16, 185, 129, 0.15);
            --accent-glow: rgba(16, 185, 129, 0.4);
            --purple: #a78bfa;
            --blue: #60a5fa;
            --orange: #fb923c;
            --red: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent) 0%, #059669 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            font-size: 14px;
            color: #000;
        }

        .navbar-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .navbar-divider {
            width: 1px;
            height: 24px;
            background: var(--border-color);
            margin: 0 4px;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .file-info .filename {
            color: var(--text-primary);
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-info .record-count {
            color: var(--accent);
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-icon-btn {
            width: 36px;
            height: 36px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text-muted);
        }

        .nav-icon-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .nav-icon-btn.active {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent);
        }

        .nav-icon-btn svg {
            width: 18px;
            height: 18px;
        }

        input[type="file"] {
            display: none;
        }

        /* Upload Overlay (shown when no file loaded) */
        .upload-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--bg-card);
        }

        .upload-overlay:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        .upload-overlay .upload-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            background: var(--bg-elevated);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-overlay .upload-icon svg {
            width: 32px;
            height: 32px;
            color: var(--accent);
        }

        .upload-overlay .upload-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .upload-overlay .upload-hint {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* Search Bar (expandable) */
        .search-bar {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .search-bar.visible {
            display: flex;
        }

        .search-input {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .search-bar .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
        }

        .btn-primary:hover {
            background: #0d9668;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            padding: 10px 12px;
        }

        .btn-ghost:hover {
            color: var(--text-primary);
        }

        .search-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'IBM Plex Mono', monospace;
            white-space: nowrap;
        }

        .search-status.has-results {
            color: var(--accent);
        }

        .search-status.no-results {
            color: var(--red);
        }

        .mode-toggle {
            display: flex;
            background: var(--bg-elevated);
            border-radius: 6px;
            padding: 3px;
        }

        .mode-btn {
            padding: 6px 12px;
            background: transparent;
            border: none;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .mode-btn:hover:not(.active) {
            color: var(--text-secondary);
        }

        /* Main Layout */
        .main-content {
            display: flex;
            gap: 0;
            height: calc(100vh - 180px);
            min-height: 400px;
        }

        /* Collapsible Panel Base */
        .collapsible-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .collapsible-panel.collapsed {
            flex: 0 0 40px;
            cursor: pointer;
        }

        .collapsible-panel.collapsed:hover {
            background: var(--bg-elevated);
        }

        /* Collapsed Strip */
        .collapsed-strip {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 12px 0;
            gap: 12px;
        }

        .collapsible-panel.collapsed .collapsed-strip {
            display: flex;
        }

        .collapsible-panel.collapsed .panel-content {
            display: none;
        }

        .collapsed-label {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .collapse-btn {
            width: 24px;
            height: 24px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-family: 'IBM Plex Mono', monospace;
            transition: all 0.15s;
        }

        .collapse-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Results Panel */
        .results-panel {
            flex: 0 0 300px;
            border-radius: 16px 0 0 16px;
            border-right: none;
        }

        .results-panel.collapsed {
            border-radius: 16px 0 0 16px;
            border-right: none;
        }

        .results-panel .panel-content {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .panel-header {
            padding: 14px 16px;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-list {
            flex: 1;
            overflow-y: auto;
        }

        .result-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item:hover {
            background: var(--bg-elevated);
        }

        .result-item.active {
            background: var(--accent-dim);
            border-left: 3px solid var(--accent);
            padding-left: 13px;
        }

        .result-number {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .result-preview {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Detail Panel */
        .detail-panel {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0 16px 16px 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .detail-header {
            padding: 14px 20px;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detail-title {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .detail-nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-btn {
            padding: 6px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }

        .nav-btn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .record-display {
            flex: 1;
            overflow-y: auto;
        }

        /* When results panel is collapsed */
        .main-content:has(.results-panel.collapsed) .detail-panel {
            border-radius: 0 16px 16px 0;
        }

        /* Browse mode - hide results panel completely */
        .main-content.browse-mode .results-panel {
            display: none;
        }

        .main-content.browse-mode .detail-panel {
            border-radius: 16px;
        }

        /* Field Rows */
        .field-row {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .field-row:last-child {
            border-bottom: none;
        }

        .field-name {
            flex: 0 0 200px;
            padding: 12px 16px;
            background: var(--bg-elevated);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--purple);
            border-right: 1px solid var(--border-color);
            word-break: break-all;
            hyphens: none;
        }

        .field-value {
            flex: 1;
            padding: 12px 16px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
            overflow-x: auto;
        }

        .field-value.null-value {
            color: var(--text-muted);
            font-style: italic;
        }

        .field-value.string-value {
            color: var(--accent);
        }

        .field-value.number-value {
            color: var(--blue);
        }

        .field-value.boolean-value {
            color: var(--orange);
        }

        .field-value.object-value,
        .field-value.array-value {
            color: var(--text-secondary);
            background: var(--bg-primary);
            border-radius: 4px;
            font-size: 0.75rem;
        }

        /* Highlight */
        .highlight {
            background: rgba(16, 185, 129, 0.3);
            color: var(--accent);
            padding: 1px 4px;
            border-radius: 3px;
        }

        .field-row.has-match {
            background: rgba(16, 185, 129, 0.08);
        }

        .field-row.has-match .field-name {
            background: rgba(16, 185, 129, 0.12);
        }

        /* States */
        .hidden {
            display: none !important;
        }

        .error-message {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: var(--red);
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.875rem;
        }

        .empty-state {
            padding: 48px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
                height: auto;
            }

            .results-panel {
                flex: none;
                max-height: 200px;
                border-radius: 16px 16px 0 0;
                border-right: 1px solid var(--border-color);
            }

            .results-panel.collapsed {
                max-height: 40px;
            }

            .detail-panel {
                border-radius: 0 0 16px 16px;
                min-height: 400px;
            }

            .navbar {
                flex-wrap: wrap;
                gap: 12px;
            }

            .navbar-left {
                flex: 1;
                min-width: 0;
            }

            .file-info .filename {
                max-width: 120px;
            }

            .search-bar {
                flex-wrap: wrap;
            }

            .search-input {
                flex: 1 1 100%;
                order: 1;
            }

            .search-bar .btn-primary {
                order: 2;
            }

            .search-status {
                order: 4;
                flex: 1 1 100%;
            }

            .mode-toggle {
                order: 3;
            }

            .btn-ghost {
                order: 5;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="navbar-left">
                <div class="navbar-brand">
                    <div class="navbar-logo">{}</div>
                    <span class="navbar-title">JSONL Viewer</span>
                </div>
                <div class="navbar-divider" id="file-divider" style="display: none;"></div>
                <div class="file-info" id="file-info" style="display: none;">
                    <span class="filename" id="filename"></span>
                    <span class="record-count" id="record-count"></span>
                </div>
            </div>
            <div class="navbar-actions" id="navbar-actions" style="display: none;">
                <label class="nav-icon-btn" for="file-input" title="Change file">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                    </svg>
                </label>
                <button class="nav-icon-btn" id="search-toggle-btn" title="Search">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </button>
            </div>
            <input type="file" id="file-input" accept=".jsonl,.json,.ndjson">
        </nav>

        <div id="error-container" class="hidden"></div>

        <!-- Upload Overlay (shown when no file loaded) -->
        <label class="upload-overlay" id="upload-overlay" for="file-input">
            <div class="upload-icon">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                </svg>
            </div>
            <span class="upload-label">Drop your JSONL file here</span>
            <span class="upload-hint">or click to browse • .jsonl, .json, .ndjson</span>
        </label>

        <!-- Viewer Section (shown after file loaded) -->
        <div id="viewer-section" class="hidden">
            <!-- Search Bar (expandable) -->
            <div class="search-bar" id="search-bar">
                <input type="text" class="search-input" id="search-input" placeholder="Search records...">
                <button class="btn btn-primary" id="search-btn">Search</button>
                <div class="search-status" id="search-status"></div>
                <div class="mode-toggle">
                    <button class="mode-btn active" id="browse-mode-btn">All</button>
                    <button class="mode-btn" id="search-mode-btn">Results</button>
                </div>
                <button class="btn btn-ghost" id="close-search-btn">✕</button>
            </div>

            <div class="main-content browse-mode" id="main-content">
                <div class="results-panel collapsible-panel" id="results-panel">
                    <div class="collapsed-strip">
                        <button class="collapse-btn" id="expand-results-btn">»</button>
                        <span class="collapsed-label">Results</span>
                    </div>
                    <div class="panel-content">
                        <div class="panel-header">
                            <span>Search Results</span>
                            <button class="collapse-btn" id="collapse-results-btn">«</button>
                        </div>
                        <div class="results-list" id="results-list"></div>
                    </div>
                </div>

                <div class="detail-panel" id="detail-panel">
                    <div class="detail-header">
                        <span class="detail-title" id="detail-title">Record 1 of 0</span>
                        <div class="detail-nav">
                            <button class="nav-btn" id="prev-btn">← Prev</button>
                            <button class="nav-btn" id="next-btn">Next →</button>
                        </div>
                    </div>
                    <div class="record-display" id="record-display"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let records = [];
        let currentIndex = 0;
        let searchTerm = '';
        let matchingIndices = [];
        let isSearchMode = false;

        const fileInput = document.getElementById('file-input');
        const uploadOverlay = document.getElementById('upload-overlay');
        const fileDivider = document.getElementById('file-divider');
        const fileInfo = document.getElementById('file-info');
        const filename = document.getElementById('filename');
        const recordCount = document.getElementById('record-count');
        const navbarActions = document.getElementById('navbar-actions');
        const searchToggleBtn = document.getElementById('search-toggle-btn');
        const viewerSection = document.getElementById('viewer-section');
        const errorContainer = document.getElementById('error-container');
        const recordDisplay = document.getElementById('record-display');
        const detailTitle = document.getElementById('detail-title');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const searchBar = document.getElementById('search-bar');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const closeSearchBtn = document.getElementById('close-search-btn');
        const searchStatus = document.getElementById('search-status');
        const mainContent = document.getElementById('main-content');
        const resultsList = document.getElementById('results-list');
        const browseModeBtn = document.getElementById('browse-mode-btn');
        const searchModeBtn = document.getElementById('search-mode-btn');
        const resultsPanel = document.getElementById('results-panel');
        const collapseResultsBtn = document.getElementById('collapse-results-btn');
        const expandResultsBtn = document.getElementById('expand-results-btn');

        fileInput.addEventListener('change', handleFileUpload);
        prevBtn.addEventListener('click', () => navigate(-1));
        nextBtn.addEventListener('click', () => navigate(1));
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
        browseModeBtn.addEventListener('click', () => setMode(false));
        searchModeBtn.addEventListener('click', () => setMode(true));

        // Search toggle
        searchToggleBtn.addEventListener('click', () => {
            const isVisible = searchBar.classList.toggle('visible');
            searchToggleBtn.classList.toggle('active', isVisible);
            if (isVisible) {
                searchInput.focus();
            }
        });

        closeSearchBtn.addEventListener('click', () => {
            clearSearch();
            searchBar.classList.remove('visible');
            searchToggleBtn.classList.remove('active');
        });

        // Collapse/expand results panel
        collapseResultsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resultsPanel.classList.add('collapsed');
        });
        expandResultsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resultsPanel.classList.remove('collapsed');
        });
        resultsPanel.addEventListener('click', (e) => {
            if (resultsPanel.classList.contains('collapsed')) {
                resultsPanel.classList.remove('collapsed');
            }
        });

        // Drag and drop
        const uploadZone = document.getElementById('upload-overlay');
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.style.borderColor = 'var(--accent)';
            uploadZone.style.background = 'var(--accent-dim)';
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.style.borderColor = '';
            uploadZone.style.background = '';
        });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.style.borderColor = '';
            uploadZone.style.background = '';
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFileUpload({ target: fileInput });
            }
        });

        document.addEventListener('keydown', (e) => {
            if (records.length === 0) return;
            if (document.activeElement === searchInput) return;
            if (e.key === 'ArrowLeft') navigate(-1);
            if (e.key === 'ArrowRight') navigate(1);
        });

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            errorContainer.classList.add('hidden');
            clearSearch();
            searchBar.classList.remove('visible');
            searchToggleBtn.classList.remove('active');

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    parseJSONL(e.target.result);
                    // Show file info in navbar
                    uploadOverlay.style.display = 'none';
                    fileDivider.style.display = '';
                    fileInfo.style.display = '';
                    filename.textContent = file.name;
                    recordCount.textContent = `${records.length.toLocaleString()} records`;
                    navbarActions.style.display = '';
                    viewerSection.classList.remove('hidden');
                    displayRecord();
                } catch (error) {
                    showError(`Error parsing file: ${error.message}`);
                    resetFileUI();
                }
            };
            reader.onerror = () => {
                showError('Error reading file');
                resetFileUI();
            };
            reader.readAsText(file);
        }

        function resetFileUI() {
            uploadOverlay.style.display = '';
            fileDivider.style.display = 'none';
            fileInfo.style.display = 'none';
            navbarActions.style.display = 'none';
            viewerSection.classList.add('hidden');
        }

        function parseJSONL(content) {
            records = [];
            const lines = content.split('\n');

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line === '') continue;

                try {
                    const obj = JSON.parse(line);
                    records.push(obj);
                } catch (error) {
                    throw new Error(`Invalid JSON on line ${i + 1}: ${error.message}`);
                }
            }

            if (records.length === 0) {
                throw new Error('No valid JSON records found in file');
            }

            currentIndex = 0;
        }

        function setMode(searchMode) {
            isSearchMode = searchMode;
            mainContent.classList.toggle('browse-mode', !searchMode);
            browseModeBtn.classList.toggle('active', !searchMode);
            searchModeBtn.classList.toggle('active', searchMode);
        }

        function displayRecord() {
            if (records.length === 0) return;

            const activeIndices = isSearchMode && matchingIndices.length > 0 ? matchingIndices : null;
            const record = records[currentIndex];

            if (activeIndices) {
                const matchNum = activeIndices.indexOf(currentIndex) + 1;
                detailTitle.textContent = `Match ${matchNum} of ${activeIndices.length} • Record #${currentIndex + 1}`;
                const currentMatchPos = activeIndices.indexOf(currentIndex);
                prevBtn.disabled = currentMatchPos <= 0;
                nextBtn.disabled = currentMatchPos >= activeIndices.length - 1;
            } else {
                detailTitle.textContent = `Record ${currentIndex + 1} of ${records.length.toLocaleString()}`;
                prevBtn.disabled = currentIndex === 0;
                nextBtn.disabled = currentIndex === records.length - 1;
            }

            recordDisplay.innerHTML = '';
            const fields = getAllFields(record);

            for (const field of fields) {
                const value = getNestedValue(record, field);
                const row = createFieldRow(field, value, searchTerm);
                recordDisplay.appendChild(row);
            }

            document.querySelectorAll('.result-item').forEach((item, idx) => {
                item.classList.toggle('active', matchingIndices[idx] === currentIndex);
                if (matchingIndices[idx] === currentIndex) {
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            });
        }

        function getAllFields(obj, prefix = '') {
            const fields = [];
            for (const key of Object.keys(obj)) {
                const fullKey = prefix ? `${prefix}.${key}` : key;
                const value = obj[key];
                if (value !== null && typeof value === 'object' && !Array.isArray(value)) {
                    fields.push(...getAllFields(value, fullKey));
                } else {
                    fields.push(fullKey);
                }
            }
            return fields;
        }

        function getNestedValue(obj, path) {
            const keys = path.split('.');
            let value = obj;
            for (const key of keys) {
                if (value === null || value === undefined) return undefined;
                value = value[key];
            }
            return value;
        }

        function createFieldRow(fieldName, value, highlightTerm = '') {
            const row = document.createElement('div');
            row.className = 'field-row';

            const nameEl = document.createElement('div');
            nameEl.className = 'field-name';
            nameEl.textContent = fieldName;

            const valueEl = document.createElement('div');
            valueEl.className = 'field-value';

            let displayText = '';
            if (value === null || value === undefined) {
                valueEl.classList.add('null-value');
                displayText = value === null ? 'null' : 'undefined';
            } else if (typeof value === 'string') {
                valueEl.classList.add('string-value');
                displayText = value;
            } else if (typeof value === 'number') {
                valueEl.classList.add('number-value');
                displayText = value.toString();
            } else if (typeof value === 'boolean') {
                valueEl.classList.add('boolean-value');
                displayText = value.toString();
            } else if (Array.isArray(value)) {
                valueEl.classList.add('array-value');
                displayText = JSON.stringify(value, null, 2);
            } else if (typeof value === 'object') {
                valueEl.classList.add('object-value');
                displayText = JSON.stringify(value, null, 2);
            } else {
                displayText = String(value);
            }

            if (highlightTerm && displayText.toLowerCase().includes(highlightTerm.toLowerCase())) {
                row.classList.add('has-match');
                valueEl.innerHTML = highlightText(displayText, highlightTerm);
            } else {
                valueEl.textContent = displayText;
            }

            row.appendChild(nameEl);
            row.appendChild(valueEl);
            return row;
        }

        function highlightText(text, term) {
            if (!term) return escapeHtml(text);
            const regex = new RegExp(`(${escapeRegex(term)})`, 'gi');
            return escapeHtml(text).replace(regex, '<span class="highlight">$1</span>');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function navigate(direction) {
            if (isSearchMode && matchingIndices.length > 0) {
                const currentMatchPos = matchingIndices.indexOf(currentIndex);
                const newMatchPos = currentMatchPos + direction;
                if (newMatchPos >= 0 && newMatchPos < matchingIndices.length) {
                    currentIndex = matchingIndices[newMatchPos];
                    displayRecord();
                }
            } else {
                const newIndex = currentIndex + direction;
                if (newIndex >= 0 && newIndex < records.length) {
                    currentIndex = newIndex;
                    displayRecord();
                }
            }
        }

        function showError(message) {
            errorContainer.innerHTML = `<div class="error-message">${message}</div>`;
            errorContainer.classList.remove('hidden');
            viewerSection.classList.add('hidden');
        }

        function performSearch() {
            const term = searchInput.value.trim();
            if (!term) {
                clearSearch();
                return;
            }

            searchTerm = term;
            matchingIndices = [];

            for (let i = 0; i < records.length; i++) {
                if (recordMatchesSearch(records[i], term)) {
                    matchingIndices.push(i);
                }
            }

            if (matchingIndices.length === 0) {
                searchStatus.textContent = `No records found containing "${term}"`;
                searchStatus.className = 'search-status no-results';
                resultsList.innerHTML = '<div class="empty-state">No matching records</div>';
            } else {
                searchStatus.textContent = `Found ${matchingIndices.length.toLocaleString()} record${matchingIndices.length === 1 ? '' : 's'}`;
                searchStatus.className = 'search-status has-results';
                renderResultsList();
                currentIndex = matchingIndices[0];
            }

            setMode(true);
            displayRecord();
        }

        function renderResultsList() {
            resultsList.innerHTML = '';

            for (let i = 0; i < matchingIndices.length; i++) {
                const recordIndex = matchingIndices[i];
                const record = records[recordIndex];

                const item = document.createElement('div');
                item.className = 'result-item' + (recordIndex === currentIndex ? ' active' : '');

                const numberEl = document.createElement('div');
                numberEl.className = 'result-number';
                numberEl.textContent = `Record #${recordIndex + 1}`;

                const previewEl = document.createElement('div');
                previewEl.className = 'result-preview';
                previewEl.innerHTML = getMatchPreview(record, searchTerm);

                item.appendChild(numberEl);
                item.appendChild(previewEl);
                item.addEventListener('click', () => {
                    currentIndex = recordIndex;
                    displayRecord();
                });

                resultsList.appendChild(item);
            }
        }

        function getMatchPreview(record, term) {
            const matchingText = findMatchingText(record, term.toLowerCase());
            if (!matchingText) return escapeHtml(JSON.stringify(record).substring(0, 100));

            const lowerText = matchingText.toLowerCase();
            const matchIndex = lowerText.indexOf(term.toLowerCase());
            const start = Math.max(0, matchIndex - 20);
            const end = Math.min(matchingText.length, matchIndex + term.length + 40);

            let preview = matchingText.substring(start, end);
            if (start > 0) preview = '…' + preview;
            if (end < matchingText.length) preview = preview + '…';

            return highlightText(preview, term);
        }

        function findMatchingText(value, term) {
            if (value === null || value === undefined) return null;
            if (typeof value === 'string') {
                return value.toLowerCase().includes(term) ? value : null;
            }
            if (typeof value === 'number' || typeof value === 'boolean') {
                const str = String(value);
                return str.toLowerCase().includes(term) ? str : null;
            }
            if (Array.isArray(value)) {
                for (const item of value) {
                    const result = findMatchingText(item, term);
                    if (result) return result;
                }
            }
            if (typeof value === 'object') {
                for (const v of Object.values(value)) {
                    const result = findMatchingText(v, term);
                    if (result) return result;
                }
            }
            return null;
        }

        function recordMatchesSearch(record, term) {
            return searchInValue(record, term.toLowerCase());
        }

        function searchInValue(value, term) {
            if (value === null || value === undefined) return false;
            if (typeof value === 'string') return value.toLowerCase().includes(term);
            if (typeof value === 'number' || typeof value === 'boolean') {
                return String(value).toLowerCase().includes(term);
            }
            if (Array.isArray(value)) return value.some(item => searchInValue(item, term));
            if (typeof value === 'object') {
                return Object.values(value).some(v => searchInValue(v, term));
            }
            return false;
        }

        function clearSearch() {
            searchTerm = '';
            matchingIndices = [];
            searchInput.value = '';
            searchStatus.textContent = '';
            searchStatus.className = 'search-status';
            resultsList.innerHTML = '';
            setMode(false);
            resultsPanel.classList.remove('collapsed');
            if (records.length > 0) displayRecord();
        }
    </script>
</body>
</html>
