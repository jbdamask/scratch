<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Select & Extract</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.400.0/lucide.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        :root {
            --background: 248 250 252;
            --foreground: 51 65 85;
            --primary: 59 130 246;
            --primary-foreground: 255 255 255;
            --secondary: 226 232 240;
            --secondary-foreground: 71 85 105;
            --muted: 241 245 249;
            --muted-foreground: 100 116 139;
            --accent: 14 165 233;
            --accent-foreground: 15 23 42;
            --destructive: 239 68 68;
            --destructive-foreground: 254 242 242;
            --border: 226 232 240;
            --input: 255 255 255;
            --ring: 59 130 246;
            --card: 255 255 255;
            --card-foreground: 30 41 59;
            --success: 16 185 129;
            --warning: 245 158 11;
            --danger: 239 68 68;
            --info: 14 165 233;
        }

        body {
            background-color: rgb(var(--background));
            color: rgb(var(--foreground));
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .volino-card {
            background-color: rgb(var(--card));
            border: 1px solid rgb(var(--border));
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        }

        .volino-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            height: 2.5rem;
            padding: 0.5rem 1rem;
            background-color: rgb(var(--primary));
            color: rgb(var(--primary-foreground));
            border: none;
            cursor: pointer;
        }

        .volino-button:hover:not(:disabled) {
            background-color: rgb(var(--primary) / 0.9);
        }

        .volino-button:disabled {
            background-color: rgb(var(--muted));
            color: rgb(var(--muted-foreground));
            cursor: not-allowed;
        }

        .volino-button-success {
            background-color: rgb(var(--success));
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            height: 2.5rem;
            padding: 0.5rem 1rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        .volino-button-success:hover:not(:disabled) {
            background-color: rgb(var(--success) / 0.9);
            box-shadow: 0 2px 4px 0 rgb(0 0 0 / 0.1);
        }

        .volino-button-success:disabled {
            background-color: rgb(var(--muted));
            color: rgb(var(--muted-foreground));
            cursor: not-allowed;
            box-shadow: none;
        }

        .volino-button-danger {
            background-color: rgb(var(--danger));
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            padding: 0;
            font-size: 14px;
        }

        .volino-button-danger:hover:not(:disabled) {
            background-color: rgb(var(--danger) / 0.9);
        }

        .volino-input {
            display: flex;
            height: 2.5rem;
            width: 100%;
            border-radius: 0.375rem;
            border: 1px solid rgb(var(--border));
            background-color: rgb(var(--input));
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .volino-input:focus {
            outline: none;
            border-color: rgb(var(--ring));
            box-shadow: 0 0 0 2px rgb(var(--ring) / 0.2);
        }

        .header {
            background-color: rgb(var(--card));
            border-bottom: 1px solid rgb(var(--border));
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(var(--border) / 0.1);
        }

        .panel-header {
            background-color: rgb(var(--muted));
            border-bottom: 1px solid rgb(var(--border));
            color: rgb(var(--card-foreground));
            font-weight: 600;
        }

        .splitter {
            background-color: rgb(var(--border));
            transition: background-color 0.2s;
        }

        .splitter:hover {
            background-color: rgb(var(--primary));
        }

        .splitter::before {
            background-color: rgb(var(--muted-foreground));
        }

        .splitter:hover::before {
            background-color: white;
        }

        .text-item {
            border-bottom: 1px solid rgb(var(--border));
            transition: background-color 0.2s;
        }

        .text-item:hover {
            background-color: rgb(var(--muted) / 0.5);
        }

        .selection-highlight {
            background-color: rgb(var(--warning) / 0.3) !important;
            transition: background-color 0.3s;
        }

        .status-message {
            background-color: rgb(var(--success) / 0.1);
            border: 1px solid rgb(var(--success) / 0.3);
            color: rgb(var(--success));
            border-radius: 0.375rem;
        }

        .empty-state {
            color: rgb(var(--muted-foreground));
        }

        .file-content.empty {
            color: rgb(var(--muted-foreground));
        }

        /* Comprehensive Markdown Styles */
        .markdown-content {
            max-width: 900px;
        }

        .markdown-content h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 1.5rem;
            line-height: 1.2;
            color: rgb(var(--card-foreground));
            border-bottom: 2px solid rgb(var(--border));
            padding-bottom: 0.5rem;
        }

        .markdown-content h2 {
            font-size: 1.875rem;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 1rem;
            line-height: 1.3;
            color: rgb(var(--card-foreground));
            border-bottom: 1px solid rgb(var(--border));
            padding-bottom: 0.375rem;
        }

        .markdown-content h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            line-height: 1.4;
            color: rgb(var(--card-foreground));
        }

        .markdown-content h4 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            line-height: 1.4;
            color: rgb(var(--card-foreground));
        }

        .markdown-content h5 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            line-height: 1.4;
            color: rgb(var(--card-foreground));
        }

        .markdown-content h6 {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            line-height: 1.4;
            color: rgb(var(--muted-foreground));
        }

        .markdown-content p {
            margin-bottom: 1rem;
            line-height: 1.7;
        }

        .markdown-content a {
            color: rgb(var(--primary));
            text-decoration: none;
            font-weight: 500;
        }

        .markdown-content a:hover {
            text-decoration: underline;
        }

        .markdown-content strong {
            font-weight: 600;
            color: rgb(var(--card-foreground));
        }

        .markdown-content em {
            font-style: italic;
        }

        .markdown-content code {
            background-color: rgb(var(--muted));
            border-radius: 0.25rem;
            padding: 0.125rem 0.375rem;
            font-size: 0.875em;
            font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
            color: rgb(239 68 68);
        }

        .markdown-content pre {
            background-color: rgb(var(--muted));
            border-radius: 0.5rem;
            padding: 1rem;
            margin: 1rem 0;
            overflow-x: auto;
            border: 1px solid rgb(var(--border));
        }

        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
            border-radius: 0;
            color: rgb(var(--foreground));
            font-size: 0.875rem;
        }

        .markdown-content ul, .markdown-content ol {
            margin-bottom: 1rem;
            padding-left: 2rem;
        }

        .markdown-content ul {
            list-style-type: disc;
        }

        .markdown-content ol {
            list-style-type: decimal;
        }

        .markdown-content li {
            margin-bottom: 0.5rem;
            line-height: 1.7;
        }

        .markdown-content li > ul, .markdown-content li > ol {
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .markdown-content blockquote {
            border-left: 4px solid rgb(var(--primary));
            padding-left: 1rem;
            margin: 1rem 0;
            color: rgb(var(--muted-foreground));
            font-style: italic;
        }

        .markdown-content blockquote p {
            margin-bottom: 0.5rem;
        }

        .markdown-content hr {
            border: none;
            border-top: 2px solid rgb(var(--border));
            margin: 2rem 0;
        }

        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }

        .markdown-content table th {
            background-color: rgb(var(--muted));
            padding: 0.75rem;
            text-align: left;
            font-weight: 600;
            border: 1px solid rgb(var(--border));
        }

        .markdown-content table td {
            padding: 0.75rem;
            border: 1px solid rgb(var(--border));
        }

        .markdown-content table tr:nth-child(even) {
            background-color: rgb(var(--muted) / 0.3);
        }

        .markdown-content img {
            max-width: 100%;
            height: auto;
            border-radius: 0.375rem;
            margin: 1rem 0;
        }

        .markdown-content :first-child {
            margin-top: 0;
        }

        .markdown-content :last-child {
            margin-bottom: 0;
        }

        .file-input {
            color: rgb(var(--muted-foreground));
        }

        .file-input::file-selector-button {
            background-color: rgb(var(--secondary));
            border: 1px solid rgb(var(--border));
            color: rgb(var(--secondary-foreground));
            padding: 0.25rem 0.75rem;
            border-radius: 0.25rem;
            cursor: pointer;
            margin-right: 0.75rem;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .file-input::file-selector-button:hover {
            background-color: rgb(var(--accent));
            color: rgb(var(--accent-foreground));
        }

        /* Enhanced PDF Styles */
        .pdf-page {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid rgb(var(--border));
        }

        .pdf-page:last-child {
            border-bottom: none;
        }

        .pdf-page-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            padding: 0.75rem 1rem;
            background: linear-gradient(135deg, rgb(59 130 246 / 0.1) 0%, rgb(14 165 233 / 0.05) 100%);
            border-left: 4px solid rgb(var(--primary));
            border-radius: 0.375rem;
        }

        .pdf-page-number {
            font-weight: 700;
            font-size: 1.125rem;
            color: rgb(var(--primary));
            min-width: 80px;
        }

        .pdf-page-content {
            line-height: 1.8;
            font-size: 0.9375rem;
            color: rgb(30 41 59);
            text-align: justify;
            hyphens: auto;
        }

        .pdf-page-content p {
            margin-bottom: 1rem;
        }

        .pdf-page-content p:last-child {
            margin-bottom: 0;
        }

        /* Better paragraph detection */
        .pdf-paragraph {
            margin-bottom: 1rem;
            line-height: 1.8;
        }

        .pdf-paragraph.indented {
            text-indent: 2em;
        }

        /* Heading-like text (all caps or larger) */
        .pdf-heading {
            font-weight: 600;
            font-size: 1.1em;
            color: rgb(var(--card-foreground));
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        /* List-like items */
        .pdf-list-item {
            margin-left: 1.5rem;
            margin-bottom: 0.5rem;
            position: relative;
        }

        .pdf-list-item::before {
            content: '•';
            position: absolute;
            left: -1rem;
            color: rgb(var(--primary));
            font-weight: bold;
        }

        /* Better spacing for numbered items */
        .pdf-numbered-item {
            margin-bottom: 0.5rem;
        }

        /* Emphasis detection */
        .pdf-emphasis {
            font-weight: 500;
            color: rgb(15 23 42);
        }
    </style>
</head>
<body class="flex flex-col" style="height: 100vh; margin: 0; overflow: hidden;">
    <!-- Header -->
    <div class="header px-6 py-4 flex items-center justify-between flex-shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center text-white font-bold">
                <i data-lucide="file-text" class="w-5 h-5"></i>
            </div>
            <h1 class="text-2xl font-bold text-blue-500">Text Select & Extract</h1>
        </div>
        <div class="flex items-center gap-4">
            <input type="file" id="fileInput" class="file-input" accept=".txt,.md,.pdf" />
            <button id="exportBtn" class="volino-button-success" disabled>
                <i data-lucide="download" class="w-4 h-4 mr-2"></i>
                Export Selected Text
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="flex flex-1 p-4 gap-1 overflow-hidden" id="mainContainer">
        <!-- Left Panel -->
        <div class="volino-card flex flex-col" id="leftPanel" style="flex: 1; height: 100%; overflow: hidden;">
            <div class="panel-header px-4 py-3 flex items-center gap-2 flex-shrink-0">
                <i data-lucide="book-open" class="w-4 h-4"></i>
                Document Viewer
            </div>
            <div id="fileContent" class="flex-1 p-5 overflow-y-auto leading-relaxed text-sm empty">
                <div class="flex flex-col items-center justify-center h-full text-center empty-state">
                    <i data-lucide="file-plus" class="w-12 h-12 mb-4 text-gray-300"></i>
                    <p class="text-lg font-medium mb-2">No document loaded</p>
                    <p class="text-sm">Select a file (.txt, .md, or .pdf) to display its content here</p>
                </div>
            </div>
        </div>

        <!-- Splitter -->
        <div class="splitter w-1.5 cursor-col-resize relative flex-shrink-0" id="splitter">
            <div class="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 w-0.5 h-8 rounded-full splitter::before"></div>
        </div>

        <!-- Right Panel -->
        <div class="volino-card flex flex-col" id="rightPanel" style="width: 320px; height: 100%; overflow: hidden;">
            <div class="panel-header px-4 py-3 flex items-center gap-2 flex-shrink-0">
                <i data-lucide="clipboard-list" class="w-4 h-4"></i>
                Extracted Text
            </div>
            <div id="extractedText" class="flex-1 overflow-y-auto">
                <div class="p-8 text-center empty-state">
                    <i data-lucide="mouse-pointer-click" class="w-12 h-12 mb-4 text-gray-300 mx-auto"></i>
                    <p class="font-medium mb-2">No text extracted yet</p>
                    <p class="text-sm">Select text in the document and press <kbd class="px-2 py-1 bg-gray-100 rounded text-xs font-mono">spacebar</kbd> to extract it.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <script>
        class TextExtractor {
            constructor() {
                this.fileInput = document.getElementById('fileInput');
                this.fileContent = document.getElementById('fileContent');
                this.extractedText = document.getElementById('extractedText');
                this.exportBtn = document.getElementById('exportBtn');
                this.selectedTexts = [];

                this.initializeEventListeners();
                this.initializeSplitter();
                this.initializeIcons();
            }

            initializeIcons() {
                lucide.createIcons();
            }

            initializeEventListeners() {
                this.fileInput.addEventListener('change', (e) => this.handleFileLoad(e));
                document.addEventListener('keydown', (e) => this.handleKeyPress(e));
                this.exportBtn.addEventListener('click', () => this.exportText());
            }

            initializeSplitter() {
                const splitter = document.getElementById('splitter');
                const leftPanel = document.getElementById('leftPanel');
                const rightPanel = document.getElementById('rightPanel');
                const mainContainer = document.getElementById('mainContainer');

                let isResizing = false;
                let startX = 0;
                let startLeftWidth = 0;
                let startRightWidth = 0;

                splitter.addEventListener('mousedown', (e) => {
                    isResizing = true;
                    startX = e.clientX;
                    startLeftWidth = leftPanel.offsetWidth;
                    startRightWidth = rightPanel.offsetWidth;

                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';

                    e.preventDefault();
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isResizing) return;

                    const deltaX = e.clientX - startX;
                    const containerWidth = mainContainer.offsetWidth - 6;

                    const newLeftWidth = startLeftWidth + deltaX;
                    const newRightWidth = startRightWidth - deltaX;

                    if (newLeftWidth >= 200 && newRightWidth >= 200) {
                        leftPanel.style.flex = 'none';
                        leftPanel.style.width = `${newLeftWidth}px`;
                        rightPanel.style.width = `${newRightWidth}px`;
                    }
                });

                document.addEventListener('mouseup', () => {
                    if (isResizing) {
                        isResizing = false;
                        document.body.style.cursor = '';
                        document.body.style.userSelect = '';
                    }
                });
            }

            async handleFileLoad(event) {
                const file = event.target.files[0];
                if (!file) return;

                const fileType = file.name.split('.').pop().toLowerCase();
                this.fileContent.className = 'flex-1 p-5 overflow-y-auto leading-relaxed text-sm';

                try {
                    let content = '';

                    if (fileType === 'pdf') {
                        content = await this.readPdfFile(file);
                    } else if (fileType === 'md') {
                        const text = await this.readTextFile(file);
                        content = marked.parse(text);
                        this.fileContent.classList.add('markdown-content');
                    } else {
                        content = await this.readTextFile(file);
                        content = content.replace(/\n/g, '<br>');
                    }

                    this.fileContent.innerHTML = content;
                    this.showStatusMessage(`${file.name} loaded successfully`);
                } catch (error) {
                    this.fileContent.innerHTML = `<div class="text-red-500 text-center p-8">
                        <i data-lucide="alert-circle" class="w-8 h-8 mx-auto mb-2"></i>
                        <p>Error loading file: ${error.message}</p>
                    </div>`;
                    this.initializeIcons();
                }
            }

            readTextFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = () => reject(new Error('Failed to read file'));
                    reader.readAsText(file);
                });
            }

            async readPdfFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const typedArray = new Uint8Array(e.target.result);
                            const pdf = await pdfjsLib.getDocument(typedArray).promise;
                            let fullHtml = '';

                            for (let i = 1; i <= pdf.numPages; i++) {
                                const page = await pdf.getPage(i);
                                const textContent = await page.getTextContent();

                                // Enhanced text extraction with positioning info
                                const pageHtml = this.formatPdfPage(i, textContent);
                                fullHtml += pageHtml;
                            }

                            resolve(fullHtml);
                        } catch (error) {
                            reject(new Error('Failed to parse PDF: ' + error.message));
                        }
                    };
                    reader.onerror = () => reject(new Error('Failed to read PDF file'));
                    reader.readAsArrayBuffer(file);
                });
            }

            formatPdfPage(pageNum, textContent) {
                // Group text items by their vertical position to detect lines
                const lines = [];
                let currentLine = [];
                let lastY = null;
                const yThreshold = 5; // Pixels difference to consider same line

                textContent.items.forEach((item, index) => {
                    const y = item.transform[5];

                    if (lastY === null || Math.abs(y - lastY) < yThreshold) {
                        // Same line
                        currentLine.push(item);
                    } else {
                        // New line
                        if (currentLine.length > 0) {
                            lines.push(currentLine);
                        }
                        currentLine = [item];
                    }
                    lastY = y;
                });

                if (currentLine.length > 0) {
                    lines.push(currentLine);
                }

                // Sort lines by Y position (top to bottom)
                lines.sort((a, b) => b[0].transform[5] - a[0].transform[5]);

                // Build paragraphs from lines
                const paragraphs = [];
                let currentParagraph = [];

                lines.forEach((line, lineIndex) => {
                    const lineText = line.map(item => item.str).join('').trim();

                    if (lineText.length === 0) {
                        // Empty line indicates paragraph break
                        if (currentParagraph.length > 0) {
                            paragraphs.push({
                                text: currentParagraph.join(' '),
                                type: this.detectTextType(currentParagraph[0])
                            });
                            currentParagraph = [];
                        }
                    } else {
                        currentParagraph.push(lineText);

                        // Check if line ends with sentence-ending punctuation
                        const endsWithPunctuation = /[.!?]$/.test(lineText);
                        const nextLineExists = lineIndex < lines.length - 1;

                        if (endsWithPunctuation && nextLineExists) {
                            const nextLine = lines[lineIndex + 1];
                            const nextLineText = nextLine.map(item => item.str).join('').trim();

                            // If next line starts with capital or is far away, end paragraph
                            const nextStartsWithCap = /^[A-Z0-9]/.test(nextLineText);
                            if (nextStartsWithCap || !nextLineExists) {
                                paragraphs.push({
                                    text: currentParagraph.join(' '),
                                    type: this.detectTextType(currentParagraph[0])
                                });
                                currentParagraph = [];
                            }
                        }
                    }
                });

                // Add remaining paragraph
                if (currentParagraph.length > 0) {
                    paragraphs.push({
                        text: currentParagraph.join(' '),
                        type: this.detectTextType(currentParagraph[0])
                    });
                }

                // Generate HTML
                let pageHtml = `
                    <div class="pdf-page">
                        <div class="pdf-page-header">
                            <i data-lucide="file-text" class="w-5 h-5 text-blue-600"></i>
                            <span class="pdf-page-number">Page ${pageNum}</span>
                        </div>
                        <div class="pdf-page-content">
                `;

                paragraphs.forEach(para => {
                    const text = this.escapeHtml(para.text);

                    if (para.type === 'heading') {
                        pageHtml += `<div class="pdf-heading">${text}</div>`;
                    } else if (para.type === 'list') {
                        pageHtml += `<div class="pdf-list-item">${text}</div>`;
                    } else if (para.type === 'numbered') {
                        pageHtml += `<div class="pdf-numbered-item">${text}</div>`;
                    } else {
                        pageHtml += `<p class="pdf-paragraph">${text}</p>`;
                    }
                });

                pageHtml += `
                        </div>
                    </div>
                `;

                return pageHtml;
            }

            detectTextType(text) {
                if (!text) return 'normal';

                // Detect headings (all caps, or starts with numbers like "1.", "1.1")
                if (text === text.toUpperCase() && text.length < 100) {
                    return 'heading';
                }

                // Detect numbered items
                if (/^\d+[\.)]\s/.test(text)) {
                    return 'numbered';
                }

                // Detect list items (starts with bullet points or dashes)
                if (/^[•\-–—*]\s/.test(text)) {
                    return 'list';
                }

                return 'normal';
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            handleKeyPress(event) {
                if (event.code === 'Space' && !event.target.matches('input, textarea, button')) {
                    event.preventDefault();
                    this.extractSelectedText();
                }
            }

            extractSelectedText() {
                const selection = window.getSelection();
                if (selection.rangeCount === 0) return;

                const selectedText = selection.toString().trim();
                if (!selectedText) return;

                if (this.isSelectionInFileContent(selection)) {
                    this.addExtractedText(selectedText);
                    this.highlightSelection(selection);
                    selection.removeAllRanges();
                }
            }

            isSelectionInFileContent(selection) {
                const range = selection.getRangeAt(0);
                return this.fileContent.contains(range.commonAncestorContainer);
            }

            highlightSelection(selection) {
                const range = selection.getRangeAt(0);
                try {
                    const span = document.createElement('span');
                    span.className = 'selection-highlight px-1 rounded';
                    range.surroundContents(span);

                    setTimeout(() => {
                        if (span.parentNode) {
                            span.outerHTML = span.innerHTML;
                        }
                    }, 1000);
                } catch (e) {
                    // Selection spans multiple elements - that's okay
                }
            }

            addExtractedText(text) {
                if (this.selectedTexts.length === 0) {
                    this.extractedText.innerHTML = '';
                }

                const textId = Date.now() + Math.random();
                this.selectedTexts.push({ id: textId, text: text });

                const textItem = document.createElement('div');
                textItem.className = 'text-item p-3 flex justify-between items-start gap-3';

                const textContent = document.createElement('div');
                textContent.className = 'flex-1 text-sm leading-relaxed break-words';
                textContent.textContent = text;

                const removeBtn = document.createElement('button');
                removeBtn.className = 'volino-button-danger flex-shrink-0';
                removeBtn.innerHTML = '&times;';
                removeBtn.addEventListener('click', () => this.removeText(textId));

                textItem.appendChild(textContent);
                textItem.appendChild(removeBtn);
                this.extractedText.appendChild(textItem);

                this.updateExportButton();
                this.showStatusMessage('Text extracted successfully');
            }

            removeText(textId) {
                this.selectedTexts = this.selectedTexts.filter(item => item.id !== textId);
                this.renderExtractedTexts();
                this.updateExportButton();
            }

            renderExtractedTexts() {
                if (this.selectedTexts.length === 0) {
                    this.extractedText.innerHTML = `
                    <div class="p-8 text-center empty-state">
                        <i data-lucide="mouse-pointer-click" class="w-12 h-12 mb-4 text-gray-300 mx-auto"></i>
                        <p class="font-medium mb-2">No text extracted yet</p>
                        <p class="text-sm">Select text in the document and press <kbd class="px-2 py-1 bg-gray-100 rounded text-xs font-mono">spacebar</kbd> to extract it.</p>
                    </div>
                    `;
                    this.initializeIcons();
                } else {
                    this.extractedText.innerHTML = '';
                    this.selectedTexts.forEach(item => {
                        const textItem = document.createElement('div');
                        textItem.className = 'text-item p-3 flex justify-between items-start gap-3';

                        const textContent = document.createElement('div');
                        textContent.className = 'flex-1 text-sm leading-relaxed break-words';
                        textContent.textContent = item.text;

                        const removeBtn = document.createElement('button');
                        removeBtn.className = 'volino-button-danger flex-shrink-0';
                        removeBtn.innerHTML = '&times;';
                        removeBtn.addEventListener('click', () => this.removeText(item.id));

                        textItem.appendChild(textContent);
                        textItem.appendChild(removeBtn);
                        this.extractedText.appendChild(textItem);
                    });
                }
            }

            updateExportButton() {
                this.exportBtn.disabled = this.selectedTexts.length === 0;
            }

            exportText() {
                if (this.selectedTexts.length === 0) return;

                const allText = this.selectedTexts.map(item => item.text).join('\n\n');
                const blob = new Blob([allText], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = 'extracted-text.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                this.showStatusMessage(`Exported ${this.selectedTexts.length} text selections`);
            }

            showStatusMessage(message) {
                const existingMessage = document.querySelector('.status-message');
                if (existingMessage) {
                    existingMessage.remove();
                }

                const statusDiv = document.createElement('div');
                statusDiv.className = 'status-message p-3 m-4 rounded-lg text-sm flex items-center gap-2';
                statusDiv.innerHTML = `
                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                    ${message}
                `;

                this.fileContent.parentNode.insertBefore(statusDiv, this.fileContent);
                this.initializeIcons();

                setTimeout(() => {
                    if (statusDiv.parentNode) {
                        statusDiv.remove();
                    }
                }, 3000);
            }
        }

        // Initialize the application
        const textExtractor = new TextExtractor();
    </script>
</body>
</html>
