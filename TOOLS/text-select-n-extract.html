<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Select & Extract</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.400.0/lucide.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        /* Volino Theme Colors */
        :root {
            --background: 248 250 252;
            --foreground: 51 65 85;
            --primary: 59 130 246;
            --primary-foreground: 255 255 255;
            --secondary: 226 232 240;
            --secondary-foreground: 71 85 105;
            --muted: 241 245 249;
            --muted-foreground: 100 116 139;
            --accent: 14 165 233;
            --accent-foreground: 15 23 42;
            --destructive: 239 68 68;
            --destructive-foreground: 254 242 242;
            --border: 226 232 240;
            --input: 255 255 255;
            --ring: 59 130 246;
            --card: 255 255 255;
            --card-foreground: 30 41 59;
            --success: 16 185 129;
            --warning: 245 158 11;
            --danger: 239 68 68;
            --info: 14 165 233;
        }

        body {
            background-color: rgb(var(--background));
            color: rgb(var(--foreground));
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .volino-card {
            background-color: rgb(var(--card));
            border: 1px solid rgb(var(--border));
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        }

        .volino-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            height: 2.5rem;
            padding: 0.5rem 1rem;
            background-color: rgb(var(--primary));
            color: rgb(var(--primary-foreground));
            border: none;
            cursor: pointer;
        }

        .volino-button:hover:not(:disabled) {
            background-color: rgb(var(--primary) / 0.9);
        }

        .volino-button:disabled {
            background-color: rgb(var(--muted));
            color: rgb(var(--muted-foreground));
            cursor: not-allowed;
        }

        .volino-button-success {
            background-color: rgb(var(--success));
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            height: 2.5rem;
            padding: 0.5rem 1rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        .volino-button-success:hover:not(:disabled) {
            background-color: rgb(var(--success) / 0.9);
            box-shadow: 0 2px 4px 0 rgb(0 0 0 / 0.1);
        }

        .volino-button-success:disabled {
            background-color: rgb(var(--muted));
            color: rgb(var(--muted-foreground));
            cursor: not-allowed;
            box-shadow: none;
        }

        .volino-button-danger {
            background-color: rgb(var(--danger));
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            padding: 0;
            font-size: 14px;
        }

        .volino-button-danger:hover:not(:disabled) {
            background-color: rgb(var(--danger) / 0.9);
        }

        .volino-input {
            display: flex;
            height: 2.5rem;
            width: 100%;
            border-radius: 0.375rem;
            border: 1px solid rgb(var(--border));
            background-color: rgb(var(--input));
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .volino-input:focus {
            outline: none;
            border-color: rgb(var(--ring));
            box-shadow: 0 0 0 2px rgb(var(--ring) / 0.2);
        }

        .header {
            background-color: rgb(var(--card));
            border-bottom: 1px solid rgb(var(--border));
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(var(--border) / 0.1);
        }

        .panel-header {
            background-color: rgb(var(--muted));
            border-bottom: 1px solid rgb(var(--border));
            color: rgb(var(--card-foreground));
            font-weight: 600;
        }

        .splitter {
            background-color: rgb(var(--border));
            transition: background-color 0.2s;
        }

        .splitter:hover {
            background-color: rgb(var(--primary));
        }

        .splitter::before {
            background-color: rgb(var(--muted-foreground));
        }

        .splitter:hover::before {
            background-color: white;
        }

        .text-item {
            border-bottom: 1px solid rgb(var(--border));
            transition: background-color 0.2s;
        }

        .text-item:hover {
            background-color: rgb(var(--muted) / 0.5);
        }

        .selection-highlight {
            background-color: rgb(var(--warning) / 0.3) !important;
            transition: background-color 0.3s;
        }

        .status-message {
            background-color: rgb(var(--success) / 0.1);
            border: 1px solid rgb(var(--success) / 0.3);
            color: rgb(var(--success));
            border-radius: 0.375rem;
        }

        .empty-state {
            color: rgb(var(--muted-foreground));
        }

        .file-content.empty {
            color: rgb(var(--muted-foreground));
        }

        .markdown-content h1, .markdown-content h2, .markdown-content h3,
        .markdown-content h4, .markdown-content h5, .markdown-content h6 {
            color: rgb(var(--card-foreground));
        }

        .markdown-content code {
            background-color: rgb(var(--muted));
            border-radius: 0.25rem;
        }

        .markdown-content pre {
            background-color: rgb(var(--muted));
            border-radius: 0.375rem;
        }

        /* Custom file input styling */
        .file-input {
            color: rgb(var(--muted-foreground));
        }

        .file-input::file-selector-button {
            background-color: rgb(var(--secondary));
            border: 1px solid rgb(var(--border));
            color: rgb(var(--secondary-foreground));
            padding: 0.25rem 0.75rem;
            border-radius: 0.25rem;
            cursor: pointer;
            margin-right: 0.75rem;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .file-input::file-selector-button:hover {
            background-color: rgb(var(--accent));
            color: rgb(var(--accent-foreground));
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <div class="header px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center text-white font-bold">
                <i data-lucide="file-text" class="w-5 h-5"></i>
            </div>
            <h1 class="text-2xl font-bold text-blue-500">Text Select & Extract</h1>
        </div>
        <div class="flex items-center gap-4">
            <input type="file" id="fileInput" class="file-input" accept=".txt,.md,.pdf" />
            <button id="exportBtn" class="volino-button-success" disabled>
                <i data-lucide="download" class="w-4 h-4 mr-2"></i>
                Export Selected Text
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="flex flex-1 p-4 gap-1 overflow-hidden" id="mainContainer">
        <!-- Left Panel -->
        <div class="volino-card flex flex-col min-w-0" id="leftPanel" style="flex: 1;">
            <div class="panel-header px-4 py-3 flex items-center gap-2">
                <i data-lucide="book-open" class="w-4 h-4"></i>
                Document Viewer
            </div>
            <div id="fileContent" class="flex-1 p-5 overflow-y-auto leading-relaxed text-sm empty">
                <div class="flex flex-col items-center justify-center h-full text-center empty-state">
                    <i data-lucide="file-plus" class="w-12 h-12 mb-4 text-gray-300"></i>
                    <p class="text-lg font-medium mb-2">No document loaded</p>
                    <p class="text-sm">Select a file (.txt, .md, or .pdf) to display its content here</p>
                </div>
            </div>
        </div>

        <!-- Splitter -->
        <div class="splitter w-1.5 cursor-col-resize relative" id="splitter">
            <div class="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 w-0.5 h-8 rounded-full splitter::before"></div>
        </div>

        <!-- Right Panel -->
        <div class="volino-card flex flex-col w-80 min-w-0" id="rightPanel">
            <div class="panel-header px-4 py-3 flex items-center gap-2">
                <i data-lucide="clipboard-list" class="w-4 h-4"></i>
                Extracted Text
            </div>
            <div id="extractedText" class="flex-1 overflow-y-auto">
                <div class="p-8 text-center empty-state">
                    <i data-lucide="mouse-pointer-click" class="w-12 h-12 mb-4 text-gray-300 mx-auto"></i>
                    <p class="font-medium mb-2">No text extracted yet</p>
                    <p class="text-sm">Select text in the document and press <kbd class="px-2 py-1 bg-gray-100 rounded text-xs font-mono">spacebar</kbd> to extract it.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <script>
        class TextExtractor {
            constructor() {
                this.fileInput = document.getElementById('fileInput');
                this.fileContent = document.getElementById('fileContent');
                this.extractedText = document.getElementById('extractedText');
                this.exportBtn = document.getElementById('exportBtn');
                this.selectedTexts = [];

                this.initializeEventListeners();
                this.initializeSplitter();
                this.initializeIcons();
            }

            initializeIcons() {
                // Initialize Lucide icons
                lucide.createIcons();
            }

            initializeEventListeners() {
                this.fileInput.addEventListener('change', (e) => this.handleFileLoad(e));
                document.addEventListener('keydown', (e) => this.handleKeyPress(e));
                this.exportBtn.addEventListener('click', () => this.exportText());
            }

            initializeSplitter() {
                const splitter = document.getElementById('splitter');
                const leftPanel = document.getElementById('leftPanel');
                const rightPanel = document.getElementById('rightPanel');
                const mainContainer = document.getElementById('mainContainer');

                let isResizing = false;
                let startX = 0;
                let startLeftWidth = 0;
                let startRightWidth = 0;

                splitter.addEventListener('mousedown', (e) => {
                    isResizing = true;
                    startX = e.clientX;
                    startLeftWidth = leftPanel.offsetWidth;
                    startRightWidth = rightPanel.offsetWidth;

                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';

                    e.preventDefault();
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isResizing) return;

                    const deltaX = e.clientX - startX;
                    const containerWidth = mainContainer.offsetWidth - 6; // subtract splitter width

                    const newLeftWidth = startLeftWidth + deltaX;
                    const newRightWidth = startRightWidth - deltaX;

                    // Enforce minimum widths
                    if (newLeftWidth >= 200 && newRightWidth >= 200) {
                        leftPanel.style.flex = 'none';
                        leftPanel.style.width = `${newLeftWidth}px`;
                        rightPanel.style.width = `${newRightWidth}px`;
                    }
                });

                document.addEventListener('mouseup', () => {
                    if (isResizing) {
                        isResizing = false;
                        document.body.style.cursor = '';
                        document.body.style.userSelect = '';
                    }
                });
            }

            async handleFileLoad(event) {
                const file = event.target.files[0];
                if (!file) return;

                const fileType = file.name.split('.').pop().toLowerCase();
                this.fileContent.className = 'flex-1 p-5 overflow-y-auto leading-relaxed text-sm';

                try {
                    let content = '';

                    if (fileType === 'pdf') {
                        content = await this.readPdfFile(file);
                    } else if (fileType === 'md') {
                        const text = await this.readTextFile(file);
                        content = marked.parse(text);
                        this.fileContent.classList.add('markdown-content');
                    } else {
                        content = await this.readTextFile(file);
                        content = content.replace(/\n/g, '<br>');
                    }

                    this.fileContent.innerHTML = content;
                    this.showStatusMessage(`${file.name} loaded successfully`);
                } catch (error) {
                    this.fileContent.innerHTML = `<div class="text-red-500 text-center p-8">
                        <i data-lucide="alert-circle" class="w-8 h-8 mx-auto mb-2"></i>
                        <p>Error loading file: ${error.message}</p>
                    </div>`;
                    this.initializeIcons();
                }
            }

            readTextFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = () => reject(new Error('Failed to read file'));
                    reader.readAsText(file);
                });
            }

            async readPdfFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const typedArray = new Uint8Array(e.target.result);
                            const pdf = await pdfjsLib.getDocument(typedArray).promise;
                            let fullText = '';

                            for (let i = 1; i <= pdf.numPages; i++) {
                                const page = await pdf.getPage(i);
                                const textContent = await page.getTextContent();
                                const pageText = textContent.items.map(item => item.str).join(' ');
                                fullText += `<h3 class="text-lg font-semibold mt-6 mb-3 text-blue-600">Page ${i}</h3><p class="mb-4">${pageText}</p>`;
                            }

                            resolve(fullText);
                        } catch (error) {
                            reject(new Error('Failed to parse PDF'));
                        }
                    };
                    reader.onerror = () => reject(new Error('Failed to read PDF file'));
                    reader.readAsArrayBuffer(file);
                });
            }

            handleKeyPress(event) {
                if (event.code === 'Space' && !event.target.matches('input, textarea, button')) {
                    event.preventDefault();
                    this.extractSelectedText();
                }
            }

            extractSelectedText() {
                const selection = window.getSelection();
                if (selection.rangeCount === 0) return;

                const selectedText = selection.toString().trim();
                if (!selectedText) return;

                if (this.isSelectionInFileContent(selection)) {
                    this.addExtractedText(selectedText);
                    this.highlightSelection(selection);
                    selection.removeAllRanges();
                }
            }

            isSelectionInFileContent(selection) {
                const range = selection.getRangeAt(0);
                return this.fileContent.contains(range.commonAncestorContainer);
            }

            highlightSelection(selection) {
                const range = selection.getRangeAt(0);
                try {
                    const span = document.createElement('span');
                    span.className = 'selection-highlight px-1 rounded';
                    range.surroundContents(span);

                    setTimeout(() => {
                        if (span.parentNode) {
                            span.outerHTML = span.innerHTML;
                        }
                    }, 1000);
                } catch (e) {
                    // If surrounding fails (e.g., selection spans multiple elements), just continue
                }
            }

            addExtractedText(text) {
                if (this.selectedTexts.length === 0) {
                    this.extractedText.innerHTML = '';
                }

                const textId = Date.now() + Math.random();
                this.selectedTexts.push({ id: textId, text: text });

                const textItem = document.createElement('div');
                textItem.className = 'text-item p-3 flex justify-between items-start gap-3';

                const textContent = document.createElement('div');
                textContent.className = 'flex-1 text-sm leading-relaxed break-words';
                textContent.textContent = text;

                const removeBtn = document.createElement('button');
                removeBtn.className = 'volino-button-danger flex-shrink-0';
                removeBtn.innerHTML = '&times;';
                removeBtn.addEventListener('click', () => this.removeText(textId));

                textItem.appendChild(textContent);
                textItem.appendChild(removeBtn);
                this.extractedText.appendChild(textItem);

                this.updateExportButton();
                this.showStatusMessage('Text extracted successfully');
            }

            removeText(textId) {
                this.selectedTexts = this.selectedTexts.filter(item => item.id !== textId);
                this.renderExtractedTexts();
                this.updateExportButton();
            }

            renderExtractedTexts() {
                if (this.selectedTexts.length === 0) {
                    this.extractedText.innerHTML = `
                        <div class="p-8 text-center empty-state">
                            <i data-lucide="mouse-pointer-click" class="w-12 h-12 mb-4 text-gray-300 mx-auto"></i>
                            <p class="font-medium mb-2">No text extracted yet</p>
                            <p class="text-sm">Select text in the document and press <kbd class="px-2 py-1 bg-gray-100 rounded text-xs font-mono">spacebar</kbd> to extract it.</p>
                        </div>
                    `;
                    this.initializeIcons();
                } else {
                    this.extractedText.innerHTML = '';
                    this.selectedTexts.forEach(item => {
                        const textItem = document.createElement('div');
                        textItem.className = 'text-item p-3 flex justify-between items-start gap-3';

                        const textContent = document.createElement('div');
                        textContent.className = 'flex-1 text-sm leading-relaxed break-words';
                        textContent.textContent = item.text;

                        const removeBtn = document.createElement('button');
                        removeBtn.className = 'volino-button-danger flex-shrink-0';
                        removeBtn.innerHTML = '&times;';
                        removeBtn.addEventListener('click', () => this.removeText(item.id));

                        textItem.appendChild(textContent);
                        textItem.appendChild(removeBtn);
                        this.extractedText.appendChild(textItem);
                    });
                }
            }

            updateExportButton() {
                this.exportBtn.disabled = this.selectedTexts.length === 0;
            }

            exportText() {
                if (this.selectedTexts.length === 0) return;

                const allText = this.selectedTexts.map(item => item.text).join('\n\n');
                const blob = new Blob([allText], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = 'extracted-text.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                this.showStatusMessage(`Exported ${this.selectedTexts.length} text selections`);
            }

            showStatusMessage(message) {
                const existingMessage = document.querySelector('.status-message');
                if (existingMessage) {
                    existingMessage.remove();
                }

                const statusDiv = document.createElement('div');
                statusDiv.className = 'status-message p-3 m-4 rounded-lg text-sm flex items-center gap-2';
                statusDiv.innerHTML = `
                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                    ${message}
                `;

                this.fileContent.parentNode.insertBefore(statusDiv, this.fileContent);
                this.initializeIcons();

                setTimeout(() => {
                    if (statusDiv.parentNode) {
                        statusDiv.remove();
                    }
                }, 3000);
            }
        }

        // Initialize the application
        const textExtractor = new TextExtractor();
    </script>
</body>
</html>
